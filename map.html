<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Physio Lead Attendance Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --blue: #007D9D;
    --blue-dark: #00566D;
    --blue-soft: #E6F4F8;
    --blue-line: #9FD3E1;
    --orange: #F16F21;
    --orange-soft: #FFF1EA;
    --red: #DC2626;
    --red-dark: #991B1B;
    --red-soft: #FEE2E2;
    --yellow: #FCB913;
    --green: #1E9E63;
    --green-dark: #136F44;
    --green-soft: #E1F5EA;
    --bg: #F4F8FA;
    --card: #FFFFFF;
    --ink: #12232B;
    --muted: #5E727C;
    --border: #DCE6EB;
    --shadow-sm: 0 2px 8px rgba(18, 35, 43, 0.06);
    --shadow-md: 0 10px 28px rgba(0, 71, 90, 0.14);
    --radius: 13px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; margin: 0; }
  button, input, select { font-family: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* ---------------- Top Bar ---------------- */
  .topbar {
    height: 60px;
    flex-shrink: 0;
    background: #fff;
    border-bottom: 3px solid var(--orange);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    z-index: 1200;
    position: relative;
    box-shadow: var(--shadow-sm);
  }
  .logo {
    width: 40px; height: 40px;
    border-radius: 11px;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    background: #fff;
    flex-shrink: 0;
    font-weight: 800;
    color: var(--blue);
    font-size: 14px;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }
  .brand { min-width: 0; }
  .brand-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800; font-size: 15px;
    color: var(--blue-dark);
    white-space: nowrap; line-height: 1.2;
  }
  .brand-sub { font-size: 11px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; animation: pulse 2s infinite; }
  .live-dot.err { background: var(--red); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.85); } }

  .spacer { flex: 1; }
  .top-stats { display: flex; align-items: center; gap: 6px; }
  .stat-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 700; white-space: nowrap;
  }
  .stat-pill.active { background: var(--blue-soft); color: var(--blue-dark); }
  .stat-pill.completed { background: var(--green-soft); color: var(--green-dark); }
  .stat-pill.missing { background: var(--red-soft); color: var(--red-dark); }
  .stat-dot { width: 8px; height: 8px; border-radius: 50%; }

  .range-wrap { position: relative; }
  .range-btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 12px;
    border: 1px solid var(--blue-line);
    background: var(--blue-soft); color: var(--blue-dark);
    border-radius: 10px; font-size: 13px; font-weight: 700;
    transition: background 0.15s, border-color 0.15s;
  }
  .range-btn:hover { background: #D7EEF5; border-color: var(--blue); }

  .refresh-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff; color: var(--blue-dark);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .refresh-btn:hover { background: var(--blue-soft); border-color: var(--blue-line); }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Calendar Popover */
  .cal {
    position: absolute; right: 0; top: 46px;
    width: 296px; max-width: calc(100vw - 24px);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
    padding: 14px; z-index: 1400;
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-weight: 700; font-size: 14px; color: var(--blue-dark); }
  .cal-head button {
    width: 30px; height: 30px;
    border: 1px solid var(--border); border-radius: 8px;
    background: #fff; color: var(--blue-dark); font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-head button:hover { background: var(--blue-soft); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal-dow { font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; }
  .cal-day { height: 34px; border: none; background: none; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink); }
  .cal-day:hover { background: var(--blue-soft); }
  .cal-day.in { background: var(--blue-soft); color: var(--blue-dark); border-radius: 0; font-weight: 600; }
  .cal-day.edge { background: var(--blue); color: #fff; border-radius: 8px; font-weight: 700; }
  .cal-day.today { outline: 2px solid var(--yellow); outline-offset: -2px; }
  .cal-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .cal-today-btn { border: 1px solid var(--blue-line); background: var(--blue-soft); color: var(--blue-dark); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 8px; }
  .cal-today-btn:hover { background: var(--blue); color: #fff; }

  /* ---------------- Main Layout ---------------- */
  .main { flex: 1; display: flex; min-height: 0; position: relative; }
  .map-wrap { flex: 1; min-width: 0; position: relative; display: flex; }
  #map { flex: 1; width: 100%; height: 100%; z-index: 1; }

  .map-legend {
    position: absolute; bottom: 16px; left: 14px; z-index: 800;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 7px 12px;
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; font-weight: 600; color: var(--ink);
    box-shadow: var(--shadow-sm);
  }
  .leg-item { display: inline-flex; align-items: center; gap: 6px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }

  /* ---------------- Right Panel ---------------- */
  .panel {
    width: 420px; max-width: 100%;
    background: #fff;
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    min-height: 0; z-index: 10;
  }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); min-height: 56px; background: #fff; }
  .back-btn {
    height: 32px; padding: 0 11px;
    border: 1px solid var(--blue-line);
    background: var(--blue-soft); color: var(--blue-dark);
    border-radius: 9px; font-size: 12px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
  }
  .back-btn:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
  .panel-titles { min-width: 0; flex: 1; }
  .panel-head h2 { font-size: 15px; font-weight: 800; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-sub { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .empid {
    display: inline-block;
    font-size: 11px; font-weight: 700;
    color: var(--blue-dark);
    background: var(--blue-soft);
    border: 1px solid var(--blue-line);
    border-radius: 6px;
    padding: 1px 7px;
    white-space: nowrap;
  }

  .panel-tools { padding: 9px 12px; border-bottom: 1px solid var(--border); background: #FAFCFD; display: flex; flex-direction: column; gap: 7px; }
  .search-box { position: relative; display: flex; align-items: center; }
  .search-box svg { position: absolute; left: 10px; color: var(--muted); pointer-events: none; }
  .search-input {
    width: 100%; height: 35px;
    padding: 0 12px 0 32px;
    border: 1px solid var(--border); border-radius: 10px;
    background: #fff; font-size: 13px; color: var(--ink); outline: none;
  }
  .search-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 125, 157, 0.12); }
  .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .filter-row::-webkit-scrollbar { height: 0; }
  .fchip { border: 1px solid var(--border); background: #fff; color: var(--muted); border-radius: 999px; padding: 4px 11px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .fchip.active { background: var(--blue-dark); color: #fff; border-color: var(--blue-dark); }

  .panel-body { flex: 1; overflow-y: auto; padding: 10px 12px 24px; background: var(--bg); }
  .empty { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; background: #fff; border: 1px dashed var(--border); border-radius: var(--radius); }

  /* ---------------- Cards ---------------- */
  .pcard, .scard {
    display: block; width: 100%; text-align: left;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px; margin-bottom: 8px;
    border-left: 4px solid var(--blue-line);
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    cursor: pointer;
  }
  .pcard:hover, .scard:hover { background: #F9FDFF; border-color: var(--blue); transform: translateY(-1px); }
  .pcard.st-Active, .scard.st-Active { border-left-color: var(--blue); }
  .pcard.st-Completed, .scard.st-Completed { border-left-color: var(--green); }
  .pcard.st-Missing, .scard.st-Missing { border-left-color: var(--red); }

  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .pname { font-weight: 700; font-size: 13.5px; color: var(--ink); line-height: 1.3; word-break: break-word; }
  .punit { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .meta-grid { display: grid; grid-template-columns: 108px 1fr; gap: 3px 8px; margin-top: 8px; font-size: 11.5px; line-height: 1.4; }
  .meta-k { color: var(--muted); font-weight: 600; }
  .meta-v { color: #243A43; font-weight: 500; white-space: normal; word-break: break-word; overflow-wrap: anywhere; }

  .chip { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
  .chip.Active { background: var(--blue-soft); color: var(--blue-dark); }
  .chip.Completed { background: var(--green-soft); color: var(--green-dark); }
  .chip.Missing { background: var(--red-soft); color: var(--red-dark); }
  .chip.None { background: #EDF3F6; color: var(--muted); }
  .chip.mode { background: var(--ink); color: #fff; }
  .dur { font-weight: 800; color: var(--blue-dark); }

  /* Shift card photos */
  .sc-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 9px; padding-top: 9px; border-top: 1px solid #EDF3F6; }
  .sc-thumb-box { display: flex; align-items: center; gap: 8px; background: #F6FAFC; border: 1px solid var(--border); border-radius: 9px; padding: 5px; min-width: 0; }
  .sc-thumb-img { width: 44px; height: 44px; border-radius: 7px; object-fit: cover; flex-shrink: 0; cursor: zoom-in; border: 1px solid var(--border); background: var(--blue-soft); }
  .sc-thumb-empty { width: 44px; height: 44px; border-radius: 7px; flex-shrink: 0; background: #EDF3F6; color: var(--muted); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; }
  .sc-thumb-info { min-width: 0; flex: 1; }
  .sc-thumb-lbl { font-size: 10.5px; font-weight: 800; color: var(--ink); display: block; }
  .sc-thumb-lbl.in-lbl { color: var(--blue-dark); }
  .sc-thumb-lbl.out-lbl { color: var(--green-dark); }
  .sc-thumb-na { font-size: 10.5px; color: var(--muted); }
  .zoom-link { display: inline-block; margin-top: 2px; border: none; background: none; padding: 0; font-size: 11px; font-weight: 700; color: var(--blue); text-decoration: underline; cursor: pointer; }
  .zoom-link:hover { color: var(--blue-dark); }

  /* ---------------- Shift detail view ---------------- */
  .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
  .sum-box { background: #fff; border: 1px solid var(--blue-line); border-radius: var(--radius); padding: 8px 10px; text-align: center; box-shadow: var(--shadow-sm); }
  .sum-lbl { font-size: 10.5px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
  .sum-val { font-weight: 800; font-size: 14px; color: var(--blue-dark); margin-top: 2px; }

  .sec { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 12px; margin-bottom: 10px; box-shadow: var(--shadow-sm); }
  .sec h3 { font-size: 13.5px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 7px; color: var(--ink); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .kv { display: grid; grid-template-columns: 112px 1fr; gap: 6px 8px; font-size: 12px; line-height: 1.4; }
  .kv-k { color: var(--muted); font-weight: 600; }
  .kv-v { font-weight: 600; color: var(--ink); white-space: normal; word-break: break-word; overflow-wrap: anywhere; }
  .gps { font-variant-numeric: tabular-nums; }
  .gps-link { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700; color: var(--blue); text-decoration: underline; white-space: nowrap; }
  .gps-link:hover { color: var(--blue-dark); }

  .detail-photo-row { margin-top: 10px; display: flex; align-items: center; gap: 10px; background: #F6FAFC; border: 1px solid var(--border); border-radius: 10px; padding: 7px; }
  .detail-photo-row img { width: 68px; height: 68px; border-radius: 8px; object-fit: cover; cursor: zoom-in; flex-shrink: 0; border: 1px solid var(--border); background: var(--blue-soft); }
  .detail-photo-meta { flex: 1; min-width: 0; }
  .detail-photo-title { font-size: 12px; font-weight: 700; color: var(--ink); margin-bottom: 5px; }
  .detail-photo-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini-pill-btn { border: 1px solid var(--blue-line); background: var(--blue-soft); color: var(--blue-dark); border-radius: 7px; padding: 4px 9px; font-size: 11px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .mini-pill-btn:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
  .nophoto { margin-top: 8px; font-size: 11.5px; color: var(--muted); background: #F3F7F9; border: 1px dashed var(--border); border-radius: 9px; padding: 8px; text-align: center; }

  /* ---------------- Map Photo Bubbles (Simple, Even, Round) ---------------- */
  .bub {
  width: 42px;
  height: 42px;
  padding: 0;
  border-radius: 50%;
  border: 3px solid var(--blue);          /* ring colour */
  background: var(--blue);
  color: #fff;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 800;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
  box-shadow: 0 0 0 2px #fff, 0 3px 10px rgba(0, 0, 0, 0.3);  /* white outer edge */
  transition: transform 0.15s ease;
}
.bub:hover { transform: scale(1.1); }
.bub.Active, .bub.in { border-color: var(--blue);  background: var(--blue); }
.bub.Completed, .bub.out { border-color: var(--green); background: var(--green); }
.bub.Missing { border-color: var(--red);   background: var(--red); }
.bub span {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* Higher specificity + !important so Leaflet's "width:auto" can't override */
.leaflet-container .leaflet-marker-pane .bub img.bub-img {
  position: absolute !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  height: 100% !important;
  max-width: none !important;
  max-height: none !important;
  padding: 0 !important;
  margin: 0 !important;
  object-fit: cover;
  object-position: center;
  border-radius: 50%;
  display: block;
}

  /* ---------------- Map Popups ---------------- */
  .leaflet-popup-content-wrapper { border-radius: 14px; box-shadow: var(--shadow-md); }
  .leaflet-popup-content { font-family: 'DM Sans', sans-serif; font-size: 12.5px; line-height: 1.4; margin: 12px 14px; min-width: 245px; max-width: 290px; }
  .pop-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .pop-name { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 14px; color: var(--ink); word-break: break-word; }
  .pop-unit { font-size: 11.5px; font-weight: 600; color: var(--muted); margin-top: 2px; word-break: break-word; }
  .pop-emp { margin-top: 4px; }
  .pop-chips { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .pop-hosp { background: var(--blue-soft); border: 1px solid var(--blue-line); border-radius: 9px; padding: 5px 8px; margin-bottom: 6px; }
  .pop-hosp-k { display: block; font-size: 10px; font-weight: 700; color: var(--muted); }
  .pop-hosp-v { display: block; font-size: 12.5px; font-weight: 700; color: var(--blue-dark); word-break: break-word; }
  .pop-row { font-size: 11.5px; color: #2B424C; margin-top: 2px; word-break: break-word; }
  .pop-row b { color: var(--muted); }
  .pop-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 7px 0 6px; }
  .pop-metric { background: var(--blue-soft); border: 1px solid var(--blue-line); border-radius: 8px; padding: 4px 5px; text-align: center; }
  .pop-metric-k { display: block; font-size: 9.5px; font-weight: 700; color: var(--muted); }
  .pop-metric-v { display: block; font-size: 13px; font-weight: 800; color: var(--blue-dark); }
  .pop-remarks { background: #F6FAFC; border: 1px solid var(--border); border-radius: 8px; padding: 5px 7px; font-size: 11.5px; color: var(--ink); margin-top: 5px; word-break: break-word; }
  .pop-btn { margin-top: 9px; width: 100%; border: none; background: var(--blue); color: #fff; border-radius: 9px; padding: 7px 12px; font-size: 12px; font-weight: 700; }
  .pop-btn:hover { background: var(--blue-dark); }
  
  /* ---------------- Panel toggle ---------------- */
.main { overflow: hidden; }
.panel { transition: margin-right 0.25s ease; }
.main.collapsed .panel { margin-right: -420px; }

.panel-toggle {
  position: absolute;
  top: 50%;
  right: 420px;                 /* sits on the panel's left edge */
  transform: translateY(-50%);
  width: 22px;
  height: 56px;
  padding: 0;
  border: 1px solid var(--border);
  border-right: none;
  border-radius: 10px 0 0 10px;
  background: #fff;
  color: var(--blue-dark);
  display: flex; align-items: center; justify-content: center;
  box-shadow: -2px 2px 8px rgba(18, 35, 43, 0.12);
  z-index: 900;
  transition: right 0.25s ease, background 0.15s;
}
.panel-toggle:hover { background: var(--blue-soft); }
.panel-toggle svg { transition: transform 0.25s ease; }
.main.collapsed .panel-toggle { right: 0; }
.main.collapsed .panel-toggle svg { transform: rotate(180deg); }

@media (max-width: 800px) {
  .panel { transition: none; }
  .main.collapsed .panel { margin-right: 0; display: none; }
  .main.collapsed .map-wrap { flex: 1 1 auto; }
  .panel-toggle {
    top: 43%; right: 12px;
    transform: translateY(-50%);
    width: 56px; height: 22px;
    border: 1px solid var(--border); border-bottom: none;
    border-radius: 10px 10px 0 0;
  }
  .panel-toggle svg { transform: rotate(90deg); }
  .main.collapsed .panel-toggle { top: auto; bottom: 0; right: 12px; transform: none; }
  .main.collapsed .panel-toggle svg { transform: rotate(-90deg); }
}
  /* ---------------- Loading & Lightbox ---------------- */
  .loading {
    position: absolute; inset: 60px 0 0 0;
    background: rgba(244, 248, 250, 0.92);
    backdrop-filter: blur(4px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; font-weight: 700; color: var(--blue-dark);
    z-index: 2000; padding: 20px; text-align: center;
  }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--blue-line); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
  .loading.failed .spinner { display: none; }
  .retry-btn { border: none; background: var(--blue); color: #fff; border-radius: 9px; padding: 8px 16px; font-size: 13px; font-weight: 700; }
  .retry-btn:hover { background: var(--blue-dark); }

  .lightbox { position: fixed; inset: 0; background: rgba(10, 20, 26, 0.9); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; }
  .lightbox img { max-width: 95vw; max-height: 82vh; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .lightbox-cap { color: #fff; font-size: 13px; font-weight: 700; }
  .lightbox-close { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,0.2); color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; }

  @media (max-width: 900px) { .top-stats { display: none; } }
  @media (max-width: 800px) {
    .main { flex-direction: column; }
    .map-wrap { flex: 0 0 43%; min-height: 220px; }
    .panel { width: 100%; border-left: none; border-top: 1px solid var(--border); flex: 1; }
    .brand-sub { display: none; }
    .map-legend { bottom: 8px; left: 8px; padding: 5px 9px; gap: 8px; font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .live-dot, .spinner, .refresh-btn.spinning svg { animation: none; }
    .pcard, .scard, .bub { transition: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo" id="logo">
    <img src="/logo.png" alt="Logo" />
  </div>
  <div class="brand">
    <div class="brand-title">Lead Physios Attendance Map</div>
    <div class="brand-sub"><span class="live-dot" id="liveDot"></span><span id="syncText">Connecting...</span></div>
  </div>

  <div class="spacer"></div>
  <div class="top-stats" id="topStats"></div>

  <div class="range-wrap">
    <button class="range-btn" id="rangeBtn" type="button" aria-label="Select date range">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span id="rangeText">Today</span>
    </button>
    <div class="cal hidden" id="cal"></div>
  </div>

  <button class="refresh-btn" id="refreshBtn" title="Refresh data" aria-label="Refresh data" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
  </button>
</header>

<div class="main">
  <div class="main" id="mainWrap">
  <button class="panel-toggle" id="panelToggle" type="button" aria-label="Hide side panel" title="Hide / show panel">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <div class="map-wrap">
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-legend" id="mapLegend">
      <span class="leg-item"><span class="leg-dot" style="background:var(--blue)"></span>In</span>
      <span class="leg-item"><span class="leg-dot" style="background:var(--green)"></span>Completed</span>
      <span class="leg-item"><span class="leg-dot" style="background:var(--red)"></span>Swipe Missing</span>
    </div>
  </div>

  <aside class="panel">
    <div class="panel-head">
      <button class="back-btn hidden" id="backBtn" type="button">&larr; Back</button>
      <div class="panel-titles">
        <h2 id="panelTitle">Physios</h2>
        <div class="panel-sub" id="panelSub">Loading...</div>
      </div>
    </div>

    <div class="panel-tools" id="panelTools">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="searchInput" type="search" placeholder="Search physio, unit, or Emp ID..." autocomplete="off" />
      </div>
      <div class="filter-row" id="statusFilterRow">
        <button class="fchip active" data-filter="all" type="button">All</button>
        <button class="fchip" data-filter="Active" type="button">In</button>
        <button class="fchip" data-filter="Completed" type="button">Completed</button>
        <button class="fchip" data-filter="Missing" type="button">Swipe Missing</button>
      </div>
    </div>

    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div id="loadingMsg">Loading attendance data from Supabase...</div>
  <button class="retry-btn hidden" id="retryBtn" type="button">Try again</button>
</div>

<div class="lightbox hidden" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close photo">&times;</button>
  <img id="lightboxImg" src="" alt="Attendance photo" referrerpolicy="no-referrer" />
  <div class="lightbox-cap" id="lightboxCap"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
(function () {
  'use strict';

  var CFG = window.PHYSIOTRACK_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var TZ = CFG.TIMEZONE || 'Asia/Kolkata';
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  /* ---------------- Helpers ---------------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function orDash(v) {
    var s = String(v == null ? '' : v).trim();
    return s ? s : '-';
  }

  function todayKey() {
    return new Date().toLocaleDateString('en-CA', { timeZone: TZ });
  }

  function fmtDT(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '-';
    return d.toLocaleString('en-IN', {
      timeZone: TZ, day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: true
    });
  }

  function fmtTimeOnly(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '-';
    return d.toLocaleTimeString('en-IN', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: true });
  }

  function fmtDay(key) {
    if (!key) return '-';
    var p = String(key).split('-');
    if (p.length !== 3) return key;
    return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1].slice(0, 3) + ' ' + p[0];
  }

  function rangeLabel() {
    var tk = todayKey();
    return S.from === S.to
      ? (S.from === tk ? 'Today · ' : '') + fmtDay(S.from)
      : fmtDay(S.from) + ' – ' + fmtDay(S.to);
  }

  function statusOf(r) {
    if (!r) return 'Active';
    return r.signOutTime ? 'Completed' : (r.note === 'Signout Missing' ? 'Missing' : 'Active');
  }

  function statusLabel(r) {
    var s = statusOf(r);
    if (s === 'Active') return 'In';
    if (s === 'Completed') return 'Completed';
    return 'Swipe missing';
  }

  function elapsed(r) {
    var t = new Date(r.signInTime).getTime();
    if (isNaN(t)) return '-';
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    return (m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + 'm') + ' (running)';
  }

  function durOf(r) {
    if (!r) return '-';
    return r.signOutTime ? orDash(r.duration) : (statusOf(r) === 'Active' ? elapsed(r) : '-');
  }

  function initials(n) {
    var parts = String(n || '?').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
  }

  function validPt(lat, lng) {
    if (lat == null || lng == null || lat === '' || lng === '') return false;
    var a = Number(lat), b = Number(lng);
    return isFinite(a) && isFinite(b) && !(a === 0 && b === 0) && Math.abs(a) <= 90 && Math.abs(b) <= 180;
  }

  function haversineKm(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var km = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(2) + ' km';
  }

  function gpsText(lat, lng) {
    return validPt(lat, lng) ? Number(lat).toFixed(6) + ', ' + Number(lng).toFixed(6) : '';
  }

  function gpsHtml(lat, lng) {
    var t = gpsText(lat, lng);
    if (!t) return '-';
    var url = 'https://www.google.com/maps?q=' + encodeURIComponent(Number(lat).toFixed(6) + ',' + Number(lng).toFixed(6));
    return '<span class="gps">' + esc(t) + '</span>' +
           '<a class="gps-link" href="' + esc(url) + '" target="_blank" rel="noopener">Open map</a>';
  }

  function empBadge(empId) {
    return '<span class="empid">ID: ' + esc(orDash(empId)) + '</span>';
  }

  /* ---------------- State ---------------- */
  var S = {
    profiles: [],
    att: [],
    from: todayKey(),
    to: todayKey(),
    pending: false,
    view: 'list',      // list | shifts | detail
    prevView: 'list',
    empId: '',
    shiftId: '',
    calMonth: null,
    search: '',
    filter: 'all',
    hasFittedOnce: false
  };

  /* ---------------- Supabase client ---------------- */
  var sb = null;
  try {
    if (!window.supabase) throw new Error('Supabase library failed to load');
    if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) throw new Error('Missing SUPABASE_URL / SUPABASE_ANON_KEY in config.js');
    sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  } catch (e) {
    showLoadError(e && e.message ? e.message : e);
  }

  /* ---------------- Map ---------------- */
  var map = L.map('map', { zoomControl: true }).setView([17.385, 78.4867], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  var layer = L.layerGroup().addTo(map);

  /* Simple, even, round photo bubble with no text above the picture */
  function bubble(cls, name, lat, lng, photoUrl) {
    var inner = '<span>' + esc(initials(name)) + '</span>' +
      (photoUrl
        ? '<img class="bub-img" src="' + esc(photoUrl) + '" alt="" referrerpolicy="no-referrer" />'
        : '');

    return L.marker([lat, lng], {
      icon: L.divIcon({
        className: '',
        html: '<div class="bub ' + esc(cls) + '">' + inner + '</div>',
        iconSize: [42, 42],
        iconAnchor: [21, 21],
        popupAnchor: [0, -22]
      })
    });
  }

  function spreadCoord(lat, lng, seenMap) {
    var key = lat.toFixed(5) + ',' + lng.toFixed(5);
    var count = seenMap[key] || 0;
    seenMap[key] = count + 1;
    if (count === 0) return [lat, lng];
    var angle = count * 2.39996;
    var offset = 0.00018 * Math.sqrt(count);
    return [lat + Math.cos(angle) * offset, lng + Math.sin(angle) * offset];
  }

  function popupHtml(r, modeLabel) {
    var st = statusOf(r);
    var logout = r.signOutTime ? fmtDT(r.signOutTime) : statusLabel(r);
    var unitName = r.unit || profileOf(r.empId).unit;

    return (
      '<div class="pop-head">' +
        '<div>' +
          '<div class="pop-name">' + esc(orDash(r.physioName)) + '</div>' +
          '<div class="pop-unit">' + esc(orDash(unitName)) + '</div>' +
          '<div class="pop-emp">' + empBadge(r.empId) + '</div>' +
        '</div>' +
        '<div class="pop-chips">' +
          (modeLabel ? '<span class="chip mode">' + esc(modeLabel) + ' punch</span>' : '') +
          '<span class="chip ' + st + '">' + esc(statusLabel(r)) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="pop-hosp"><span class="pop-hosp-k">Hospital</span><span class="pop-hosp-v">' + esc(r.hospitalName || 'Hospital not entered') + '</span></div>' +
      '<div class="pop-row"><b>Login:</b> ' + esc(fmtDT(r.signInTime)) + '</div>' +
      '<div class="pop-row"><b>Logout:</b> ' + esc(logout) + '</div>' +
      '<div class="pop-row"><b>Duration:</b> <span class="dur">' + esc(durOf(r)) + '</span></div>' +
      '<div class="pop-row"><b>PRE Name:</b> ' + esc(orDash(r.preName)) + '</div>' +
      '<div class="pop-metrics">' +
        '<div class="pop-metric"><span class="pop-metric-k">Visited</span><span class="pop-metric-v">' + esc(orDash(r.patientsVisited)) + '</span></div>' +
        '<div class="pop-metric"><span class="pop-metric-k">Assessed</span><span class="pop-metric-v">' + esc(orDash(r.assessmentsDone)) + '</span></div>' +
        '<div class="pop-metric"><span class="pop-metric-k">Converted</span><span class="pop-metric-v">' + esc(orDash(r.converted)) + '</span></div>' +
      '</div>' +
      '<div class="pop-remarks"><b>Remarks:</b> ' + esc(orDash(r.remarks)) + '</div>' +
      (S.view !== 'detail'
        ? '<button class="pop-btn" data-open="' + esc(r.id) + '" type="button">View details</button>'
        : '')
    );
  }

  function drawMap(preserveViewport) {
    layer.clearLayers();
    var pts = [];
    var seen = {};

    if (S.view === 'detail') {
      var sh = byId(S.shiftId);
      if (sh) {
        var shSt = statusOf(sh);
        if (validPt(sh.signInLat, sh.signInLng)) {
          var pIn = [Number(sh.signInLat), Number(sh.signInLng)];
          bubble(shSt === 'Missing' ? 'Missing' : 'in', sh.physioName, pIn[0], pIn[1], sh.signInPhoto)
            .bindPopup(popupHtml(sh, 'IN'))
            .addTo(layer);
          pts.push(pIn);
        }
        if (sh.signOutTime && validPt(sh.signOutLat, sh.signOutLng)) {
          var pOut = [Number(sh.signOutLat), Number(sh.signOutLng)];
          if (pts.length && Math.abs(pts[0][0] - pOut[0]) < 0.00003 && Math.abs(pts[0][1] - pOut[1]) < 0.00003) {
            pOut = [pOut[0] + 0.00018, pOut[1] + 0.00018];
          }
          bubble('Completed', sh.physioName, pOut[0], pOut[1], sh.signOutPhoto || sh.signInPhoto)
            .bindPopup(popupHtml(sh, 'OUT'))
            .addTo(layer);
          pts.push(pOut);
          if (pts.length === 2) {
            L.polyline(pts, { color: '#007D9D', weight: 3, dashArray: '7 8', opacity: 0.9 }).addTo(layer);
          }
        }
      }
    } else {
      var list = S.view === 'shifts' ? shiftsForInRange(S.empId) : S.att.filter(inRange);
      list.forEach(function (r) {
        var st = statusOf(r);
        if (st === 'Completed') {
          var hasOut = validPt(r.signOutLat, r.signOutLng);
          var lat = hasOut ? Number(r.signOutLat) : Number(r.signInLat);
          var lng = hasOut ? Number(r.signOutLng) : Number(r.signInLng);
          if (validPt(lat, lng)) {
            var cOut = spreadCoord(lat, lng, seen);
            bubble('Completed', r.physioName, cOut[0], cOut[1], r.signOutPhoto || r.signInPhoto)
              .bindPopup(popupHtml(r, hasOut ? 'OUT' : 'IN'))
              .addTo(layer);
            pts.push(cOut);
          }
        } else {
          if (validPt(r.signInLat, r.signInLng)) {
            var cIn = spreadCoord(Number(r.signInLat), Number(r.signInLng), seen);
            bubble(st, r.physioName, cIn[0], cIn[1], r.signInPhoto)
              .bindPopup(popupHtml(r, 'IN'))
              .addTo(layer);
            pts.push(cIn);
          }
        }
      });
    }

    if (!preserveViewport || !S.hasFittedOnce) {
      if (pts.length === 1) {
        map.setView(pts[0], 15);
        S.hasFittedOnce = true;
      } else if (pts.length > 1) {
        var bounds = L.latLngBounds(pts);
        if (bounds.getNorthEast().distanceTo(bounds.getSouthWest()) < 30) {
          map.setView(pts[0], 16);
        } else {
          map.fitBounds(bounds, { padding: [55, 55], maxZoom: 16 });
        }
        S.hasFittedOnce = true;
      }
    }
    setTimeout(function () { map.invalidateSize(); }, 60);
  }

  map.getContainer().addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-open]');
    if (b) openShift(b.getAttribute('data-open'));
  });

  /* Broken images: remove map photo overlays, swap thumbnails for a placeholder */
  document.addEventListener('error', function (e) {
    var t = e.target;
    if (!t || t.tagName !== 'IMG') return;
    if (t.classList.contains('bub-img')) {
      t.remove();
    } else if (t.classList.contains('sc-thumb-img')) {
      var ph = document.createElement('div');
      ph.className = 'sc-thumb-empty';
      ph.textContent = 'No pic';
      t.replaceWith(ph);
    }
  }, true);

  /* ---------------- Data accessors ---------------- */
  function byId(id) { return S.att.find(function (r) { return r.id === id; }); }
  function inRange(r) { return r.signInDate && r.signInDate >= S.from && r.signInDate <= S.to; }
  function shiftsForInRange(emp) {
    return S.att.filter(function (r) { return r.empId === emp && inRange(r); })
      .sort(function (a, b) { return new Date(b.signInTime) - new Date(a.signInTime); });
  }
  function profileOf(emp) {
    var p = S.profiles.find(function (x) { return x.empId === emp; });
    if (p) return p;
    var s = S.att.find(function (r) { return r.empId === emp; });
    return { name: s ? s.physioName : emp, unit: s ? s.unit : '', empId: emp };
  }

  /* ---------------- Rendering ---------------- */
  function renderTopStats() {
    var act = 0, comp = 0, miss = 0;
    S.att.filter(inRange).forEach(function (r) {
      var st = statusOf(r);
      if (st === 'Active') act++;
      else if (st === 'Completed') comp++;
      else miss++;
    });
    $('topStats').innerHTML =
      '<span class="stat-pill active"><span class="stat-dot" style="background:var(--blue)"></span>' + act + ' In</span>' +
      '<span class="stat-pill completed"><span class="stat-dot" style="background:var(--green)"></span>' + comp + ' Completed</span>' +
      '<span class="stat-pill missing"><span class="stat-dot" style="background:var(--red)"></span>' + miss + ' Missing</span>';
  }

  function compactThumbHtml(url, label, clsName) {
    if (!url) {
      return (
        '<div class="sc-thumb-box">' +
          '<div class="sc-thumb-empty">No pic</div>' +
          '<div class="sc-thumb-info"><span class="sc-thumb-lbl ' + clsName + '">' + esc(label) + '</span><span class="sc-thumb-na">Not available</span></div>' +
        '</div>'
      );
    }
    return (
      '<div class="sc-thumb-box">' +
        '<img class="sc-thumb-img" src="' + esc(url) + '" alt="' + esc(label) + '" referrerpolicy="no-referrer" loading="lazy" ' +
          'data-zoom="' + esc(url) + '" data-cap="' + esc(label) + '" />' +
        '<div class="sc-thumb-info">' +
          '<span class="sc-thumb-lbl ' + clsName + '">' + esc(label) + '</span>' +
          '<button class="zoom-link" type="button" data-zoom="' + esc(url) + '" data-cap="' + esc(label) + '">Full view</button>' +
        '</div>' +
      '</div>'
    );
  }

  function detailPhotoHtml(url, label) {
    if (!url) return '<div class="nophoto">Photo not available.</div>';
    return (
      '<div class="detail-photo-row">' +
        '<img src="' + esc(url) + '" alt="' + esc(label) + '" referrerpolicy="no-referrer" loading="lazy" ' +
          'data-zoom="' + esc(url) + '" data-cap="' + esc(label) + '" />' +
        '<div class="detail-photo-meta">' +
          '<div class="detail-photo-title">' + esc(label) + '</div>' +
          '<div class="detail-photo-actions">' +
            '<button class="mini-pill-btn" type="button" data-zoom="' + esc(url) + '" data-cap="' + esc(label) + '">Full view</button>' +
            '<a class="mini-pill-btn" href="' + esc(url) + '" target="_blank" rel="noopener">Open &nearr;</a>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  /* Page 1: physio list filtered by selected date / range */
  function renderList(body) {
    var rangeAtt = S.att.filter(inRange);
    $('panelTitle').textContent = 'Physios (' + S.profiles.length + ')';
    $('panelSub').textContent = rangeAtt.length + ' check-in' + (rangeAtt.length === 1 ? '' : 's') + ' · ' + rangeLabel();

    if (!S.profiles.length) {
      body.innerHTML = '<div class="empty">No physio profiles found in Supabase yet.</div>';
      return;
    }

    var q = S.search.trim().toLowerCase();
    var items = S.profiles.map(function (p) {
      var rList = shiftsForInRange(p.empId);
      var displayShift = S.filter === 'all'
        ? rList[0]
        : rList.find(function (r) { return statusOf(r) === S.filter; });
      return { profile: p, rangeShifts: rList, displayShift: displayShift };
    }).filter(function (item) {
      if (S.filter !== 'all' && !item.displayShift) return false;
      if (q) {
        var p = item.profile;
        var last = item.displayShift;
        var hay = (p.name + ' ' + p.unit + ' ' + p.empId + ' ' + (last ? last.hospitalName : '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    // Show physios with check-ins in the selected date range first
    items.sort(function (a, b) {
      var ha = a.rangeShifts.length ? 1 : 0;
      var hb = b.rangeShifts.length ? 1 : 0;
      if (ha !== hb) return hb - ha;
      if (a.displayShift && b.displayShift) {
        return new Date(b.displayShift.signInTime) - new Date(a.displayShift.signInTime);
      }
      return a.profile.name.localeCompare(b.profile.name);
    });

    if (!items.length) {
      body.innerHTML = '<div class="empty">No check-ins match your current date range, search, or filter.</div>';
      return;
    }

    body.innerHTML = items.map(function (item) {
      var p = item.profile;
      var rList = item.rangeShifts;
      var last = item.displayShift;
      var st = last ? statusOf(last) : 'None';

      var detail = last
        ? '<div class="meta-grid">' +
            '<span class="meta-k">Hospital</span><span class="meta-v">' + esc(orDash(last.hospitalName)) + '</span>' +
            '<span class="meta-k">Login</span><span class="meta-v">' + esc(fmtDT(last.signInTime)) + '</span>' +
            '<span class="meta-k">Logout</span><span class="meta-v">' + esc(last.signOutTime ? fmtDT(last.signOutTime) : statusLabel(last)) + '</span>' +
            '<span class="meta-k">Duration</span><span class="meta-v dur">' + esc(durOf(last)) +
              (rList.length > 1 ? ' · ' + rList.length + ' logins in range' : '') + '</span>' +
          '</div>'
        : '<div class="meta-grid"><span class="meta-k">Status</span><span class="meta-v" style="color:var(--muted)">No check-ins in selected dates</span></div>';

      return (
        '<div class="pcard st-' + st + '" role="button" tabindex="0" data-emp="' + esc(p.empId) + '">' +
          '<div class="row">' +
            '<div>' +
              '<div class="pname">' + esc(orDash(p.name)) + '</div>' +
              '<div class="punit">' + empBadge(p.empId) + (p.unit ? '<span>' + esc(p.unit) + '</span>' : '') + '</div>' +
            '</div>' +
            (last ? '<span class="chip ' + st + '">' + esc(statusLabel(last)) + '</span>' : '<span class="chip None">No check-in</span>') +
          '</div>' +
          detail +
        '</div>'
      );
    }).join('');
  }

  /* Page 2: all shifts of one physio within selected date / range */
  function renderShifts(body) {
    var p = profileOf(S.empId);
    var list = shiftsForInRange(S.empId);
    $('panelTitle').textContent = orDash(p.name);
    $('panelSub').innerHTML =
      empBadge(p.empId) +
      '<span>' + (p.unit ? esc(p.unit) + ' &middot; ' : '') + list.length + ' login' + (list.length === 1 ? '' : 's') + ' (' + esc(rangeLabel()) + ')</span>';

    body.innerHTML = list.length ? list.map(function (r) {
      var st = statusOf(r);
      return (
        '<div class="scard st-' + st + '" role="button" tabindex="0" data-shift="' + esc(r.id) + '">' +
          '<div class="row">' +
            '<div class="pname">' + esc(fmtDay(r.signInDate)) + '</div>' +
            '<span class="chip ' + st + '">' + esc(statusLabel(r)) + '</span>' +
          '</div>' +
          '<div class="meta-grid">' +
            '<span class="meta-k">Login</span><span class="meta-v">' + esc(fmtDT(r.signInTime)) + '</span>' +
            '<span class="meta-k">Logout</span><span class="meta-v">' + esc(r.signOutTime ? fmtDT(r.signOutTime) : '-') + ' &middot; <span class="dur">' + esc(durOf(r)) + '</span></span>' +
            '<span class="meta-k">Hospital Name</span><span class="meta-v">' + esc(orDash(r.hospitalName)) + '</span>' +
            '<span class="meta-k">PRE Name</span><span class="meta-v">' + esc(orDash(r.preName)) + '</span>' +
            '<span class="meta-k">Patients Visited</span><span class="meta-v">' + esc(orDash(r.patientsVisited)) + '</span>' +
            '<span class="meta-k">Assessments Done</span><span class="meta-v">' + esc(orDash(r.assessmentsDone)) + '</span>' +
            '<span class="meta-k">Converted</span><span class="meta-v">' + esc(orDash(r.converted)) + '</span>' +
            '<span class="meta-k">Remarks</span><span class="meta-v">' + esc(orDash(r.remarks)) + '</span>' +
          '</div>' +
          '<div class="sc-photos">' +
            compactThumbHtml(r.signInPhoto, 'Login pic', 'in-lbl') +
            compactThumbHtml(r.signOutPhoto, 'Logout pic', 'out-lbl') +
          '</div>' +
        '</div>'
      );
    }).join('') : '<div class="empty">No check-ins found for ' + esc(orDash(p.name)) + ' in ' + esc(rangeLabel()) + '.</div>';
  }

  /* Page 3: single shift */
  function renderDetail(body) {
    var r = byId(S.shiftId);
    if (!r) {
      $('panelTitle').textContent = 'Shift';
      $('panelSub').textContent = '';
      body.innerHTML = '<div class="empty">Shift not found. It may have been removed &mdash; go back and pick another.</div>';
      return;
    }

    var unitName = r.unit || profileOf(r.empId).unit;
    $('panelTitle').textContent = orDash(r.physioName);
    $('panelSub').innerHTML =
      empBadge(r.empId) +
      '<span>' + (unitName ? esc(unitName) + ' &middot; ' : '') + esc(fmtDay(r.signInDate)) + '</span>';

    var distNote = '';
    if (r.signOutTime && validPt(r.signInLat, r.signInLng) && validPt(r.signOutLat, r.signOutLng)) {
      distNote = ' (' + haversineKm(Number(r.signInLat), Number(r.signInLng), Number(r.signOutLat), Number(r.signOutLng)) + ' from sign-in)';
    }

    body.innerHTML =
      '<div class="summary">' +
        '<div class="sum-box"><div class="sum-lbl">Status</div><div class="sum-val">' + esc(statusLabel(r)) + '</div></div>' +
        '<div class="sum-box"><div class="sum-lbl">Duration</div><div class="sum-val">' + esc(durOf(r)) + '</div></div>' +
      '</div>' +

      '<div class="sec">' +
        '<h3><span class="dot" style="background:var(--blue)"></span>Sign in</h3>' +
        '<div class="kv">' +
          '<span class="kv-k">Date &amp; time</span><span class="kv-v">' + esc(fmtDT(r.signInTime)) + '</span>' +
          '<span class="kv-k">Hospital</span><span class="kv-v">' + esc(orDash(r.hospitalName)) + '</span>' +
          '<span class="kv-k">Location</span><span class="kv-v">' + esc(orDash(r.signInLocation)) + '</span>' +
          '<span class="kv-k">In GPS Coordinates</span><span class="kv-v">' + gpsHtml(r.signInLat, r.signInLng) + '</span>' +
        '</div>' +
        detailPhotoHtml(r.signInPhoto, 'Login Photo') +
      '</div>' +

      '<div class="sec">' +
        '<h3><span class="dot" style="background:' + (r.signOutTime ? 'var(--green)' : 'var(--red)') + '"></span>Sign out</h3>' +
        (r.signOutTime ? (
          '<div class="kv">' +
            '<span class="kv-k">Date &amp; time</span><span class="kv-v">' + esc(fmtDT(r.signOutTime)) + '</span>' +
            '<span class="kv-k">Location</span><span class="kv-v">' + esc(orDash(r.signOutLocation) + distNote) + '</span>' +
            '<span class="kv-k">Out GPS Coordinates</span><span class="kv-v">' + gpsHtml(r.signOutLat, r.signOutLng) + '</span>' +
            '<span class="kv-k">PRE name</span><span class="kv-v">' + esc(orDash(r.preName)) + '</span>' +
            '<span class="kv-k">Patients visited</span><span class="kv-v">' + esc(orDash(r.patientsVisited)) + '</span>' +
            '<span class="kv-k">Assessments done</span><span class="kv-v">' + esc(orDash(r.assessmentsDone)) + '</span>' +
            '<span class="kv-k">Converted</span><span class="kv-v">' + esc(orDash(r.converted)) + '</span>' +
            '<span class="kv-k">Remarks</span><span class="kv-v">' + esc(orDash(r.remarks)) + '</span>' +
          '</div>' +
          detailPhotoHtml(r.signOutPhoto, 'Logout Photo')
        ) : (
          '<div class="kv">' +
            '<span class="kv-k">Out GPS Coordinates</span><span class="kv-v">-</span>' +
          '</div>' +
          '<div class="nophoto">Not signed out yet (' + esc(statusLabel(r)) + ').</div>'
        )) +
      '</div>';
  }

  function render() {
    var back = $('backBtn');
    var body = $('panelBody');
    var tools = $('panelTools');

    $('rangeText').textContent = rangeLabel();
    renderTopStats();

    if (S.view === 'list') {
      back.classList.add('hidden');
      tools.classList.remove('hidden');
      renderList(body);
    } else {
      back.classList.remove('hidden');
      tools.classList.add('hidden');
      if (S.view === 'shifts') renderShifts(body);
      else renderDetail(body);
    }
  }

  /* ---------------- Navigation & Lightbox ---------------- */
  function openLightbox(url, caption) {
    $('lightboxImg').src = url;
    $('lightboxCap').textContent = caption || '';
    $('lightbox').classList.remove('hidden');
  }

  function closeLightbox() {
    $('lightbox').classList.add('hidden');
    $('lightboxImg').removeAttribute('src');
    $('lightboxCap').textContent = '';
  }

  function openProfile(emp) {
    S.empId = emp;
    S.view = 'shifts';
    S.hasFittedOnce = false;
    render();
    drawMap(false);
    $('panelBody').scrollTop = 0;
  }

  function openShift(id) {
    var r = byId(id);
    if (!r) return;
    S.prevView = (S.view === 'shifts' && S.empId === r.empId) ? 'shifts' : 'list';
    S.empId = r.empId;
    S.shiftId = id;
    S.view = 'detail';
    map.closePopup();
    render();
    drawMap(false);
    $('panelBody').scrollTop = 0;
  }

  $('backBtn').addEventListener('click', function () {
    S.view = (S.view === 'detail' && S.prevView === 'shifts') ? 'shifts' : 'list';
    S.hasFittedOnce = false;
    render();
    drawMap(false);
  });

  $('panelBody').addEventListener('click', function (e) {
    var zoomEl = e.target.closest && e.target.closest('[data-zoom]');
    if (zoomEl) {
      e.stopPropagation();
      openLightbox(zoomEl.getAttribute('data-zoom'), zoomEl.getAttribute('data-cap'));
      return;
    }
    if (e.target.closest && e.target.closest('a')) return;
    var s = e.target.closest && e.target.closest('[data-shift]');
    if (s) return openShift(s.getAttribute('data-shift'));
    var p = e.target.closest && e.target.closest('[data-emp]');
    if (p) openProfile(p.getAttribute('data-emp'));
  });

  $('panelBody').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var card = e.target.closest && e.target.closest('[data-shift], [data-emp]');
    if (!card || card !== e.target) return;
    e.preventDefault();
    if (card.hasAttribute('data-shift')) openShift(card.getAttribute('data-shift'));
    else openProfile(card.getAttribute('data-emp'));
  });

  $('lightbox').addEventListener('click', closeLightbox);
  $('panelToggle').addEventListener('click', function () {
  var main = $('mainWrap');
  var collapsed = main.classList.toggle('collapsed');
  this.setAttribute('aria-label', collapsed ? 'Show side panel' : 'Hide side panel');
  setTimeout(function () { map.invalidateSize(); }, 280);   // re-fit map after the slide
});
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeLightbox(); toggleCal(false); }
  });

  $('searchInput').addEventListener('input', function (e) {
    S.search = e.target.value || '';
    render();
  });

  $('statusFilterRow').addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('[data-filter]');
    if (!btn) return;
    S.filter = btn.getAttribute('data-filter');
    var btns = $('statusFilterRow').querySelectorAll('.fchip');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i] === btn);
    render();
  });

  /* ---------------- Calendar Date Range Selector ---------------- */
  function keyOf(y, m, d) {
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }

  function drawCal() {
    var cm = S.calMonth, y = cm.y, m = cm.m, tk = todayKey();
    var first = new Date(y, m, 1).getDay();
    var days = new Date(y, m + 1, 0).getDate();

    var h = '<div class="cal-head">' +
      '<button type="button" data-nav="-1" aria-label="Previous month">&lsaquo;</button>' +
      '<span>' + MONTHS[m] + ' ' + y + '</span>' +
      '<button type="button" data-nav="1" aria-label="Next month">&rsaquo;</button>' +
      '</div><div class="cal-grid">';

    ['S','M','T','W','T','F','S'].forEach(function (d) { h += '<div class="cal-dow">' + d + '</div>'; });
    for (var i = 0; i < first; i++) h += '<div></div>';
    for (var d = 1; d <= days; d++) {
      var k = keyOf(y, m, d), cls = 'cal-day';
      if (k === S.from || k === S.to) cls += ' edge';
      else if (k > S.from && k < S.to) cls += ' in';
      if (k === tk) cls += ' today';
      h += '<button type="button" class="' + cls + '" data-day="' + k + '">' + d + '</button>';
    }
    h += '</div><div class="cal-foot">' +
      '<span>' + (S.pending ? 'Tap end date (or same day)' : 'Tap date or start of range') + '</span>' +
      '<button class="cal-today-btn" type="button" data-today="1">Today</button>' +
      '</div>';

    $('cal').innerHTML = h;
  }

  function toggleCal(show) {
    var c = $('cal');
    if (show === undefined) show = c.classList.contains('hidden');
    if (show) {
      var p = S.from.split('-');
      S.calMonth = { y: Number(p[0]), m: Number(p[1]) - 1 };
      S.pending = false;
      drawCal();
      c.classList.remove('hidden');
    } else {
      c.classList.add('hidden');
      S.pending = false;
    }
  }

  $('rangeBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    toggleCal();
  });

  $('cal').addEventListener('click', function (e) {
    e.stopPropagation();
    var t = e.target.closest ? e.target.closest('button') : e.target;
    if (!t) return;
    if (t.getAttribute('data-nav')) {
      S.calMonth.m += Number(t.getAttribute('data-nav'));
      if (S.calMonth.m < 0) { S.calMonth.m = 11; S.calMonth.y--; }
      if (S.calMonth.m > 11) { S.calMonth.m = 0; S.calMonth.y++; }
      return drawCal();
    }
    if (t.getAttribute('data-today')) {
      S.from = S.to = todayKey();
      toggleCal(false);
      return afterRange();
    }
    var day = t.getAttribute('data-day');
    if (!day) return;
    if (!S.pending) {
      S.from = S.to = day;
      S.pending = true;
      drawCal();
      afterRange();
    } else {
      if (day < S.from) { S.to = S.from; S.from = day; }
      else { S.to = day; }
      toggleCal(false);
      afterRange();
    }
  });

  document.addEventListener('click', function () { toggleCal(false); });

  function afterRange() {
    if (S.view === 'detail') {
      S.view = (S.prevView === 'shifts' && S.empId) ? 'shifts' : 'list';
    }
    S.hasFittedOnce = false;
    render();
    drawMap(false);
  }

  /* ---------------- Supabase data loading ---------------- */
  async function fetchAllAttendance() {
    var all = [];
    var pageSize = 1000;
    var from = 0;
    while (true) {
      var res = await sb
        .from('attendance')
        .select('*')
        .order('sign_in_time', { ascending: false })
        .range(from, from + pageSize - 1);
      if (res.error) throw res.error;
      var chunk = res.data || [];
      all = all.concat(chunk);
      if (chunk.length < pageSize) break;
      from += pageSize;
    }
    return all;
  }

  function mapAttendanceRow(r, tk) {
    var signOutTime = r.sign_out_time || null;
    var rawDate = String(r.sign_in_date || '').trim();
    var signInDate = /^\d{4}-\d{2}-\d{2}/.test(rawDate)
      ? rawDate.slice(0, 10)
      : (r.sign_in_time ? new Date(r.sign_in_time).toLocaleDateString('en-CA', { timeZone: TZ }) : '');
    var status = signOutTime ? 'Completed' : (signInDate < tk ? 'Signout Missing' : 'Active');
    return {
      id: String(r.id),
      empId: String(r.emp_id || ''),
      physioName: String(r.physio_name || ''),
      unit: String(r.unit || ''),
      signInDate: signInDate,
      signInTime: String(r.sign_in_time || ''),
      signInLocation: String(r.sign_in_location || ''),
      signInLat: r.sign_in_lat != null ? Number(r.sign_in_lat) : null,
      signInLng: r.sign_in_lng != null ? Number(r.sign_in_lng) : null,
      hospitalName: String(r.hospital_name || ''),
      signInPhoto: r.sign_in_photo ? String(r.sign_in_photo) : '',
      signOutTime: signOutTime,
      signOutLocation: r.sign_out_location || null,
      signOutLat: r.sign_out_lat != null ? Number(r.sign_out_lat) : null,
      signOutLng: r.sign_out_lng != null ? Number(r.sign_out_lng) : null,
      preName: String(r.pre_name || ''),
      patientsVisited: String(r.patients_visited || ''),
      assessmentsDone: String(r.assessments_done || ''),
      converted: String(r.converted || ''),
      remarks: String(r.remarks || ''),
      signOutPhoto: r.sign_out_photo ? String(r.sign_out_photo) : '',
      duration: String(r.duration || ''),
      note: status
    };
  }

  function showLoadError(msg) {
    var l = $('loading');
    l.classList.remove('hidden');
    l.classList.add('failed');
    $('loadingMsg').textContent = 'Could not load data: ' + msg;
    $('retryBtn').classList.remove('hidden');
    $('syncText').textContent = 'Sync error';
    $('liveDot').classList.add('err');
    $('refreshBtn').classList.remove('spinning');
  }

  var loadingNow = false;
  async function load(isAutoRefresh) {
    if (!sb || loadingNow) return;
    loadingNow = true;
    $('refreshBtn').classList.add('spinning');
    try {
      var tk = todayKey();
      var results = await Promise.all([
        sb.from('physio_profiles').select('emp_id, name, unit').order('name', { ascending: true }),
        fetchAllAttendance()
      ]);
      var profRes = results[0];
      if (profRes.error) throw profRes.error;

      S.profiles = (profRes.data || []).map(function (p) {
        return { unit: p.unit || '', name: p.name || '', empId: p.emp_id || '' };
      });
      S.att = results[1].map(function (r) { return mapAttendanceRow(r, tk); });

      $('loading').classList.add('hidden');
      $('liveDot').classList.remove('err');
      $('refreshBtn').classList.remove('spinning');
      $('syncText').textContent = 'Live · ' + fmtTimeOnly(new Date().toISOString());

      render();
      drawMap(Boolean(isAutoRefresh));
    } catch (err) {
      showLoadError(err && err.message ? err.message : err);
    } finally {
      loadingNow = false;
    }
  }

  $('retryBtn').addEventListener('click', function () {
    var l = $('loading');
    l.classList.remove('failed');
    $('retryBtn').classList.add('hidden');
    $('loadingMsg').textContent = 'Loading attendance data from Supabase...';
    load(false);
  });

  if (sb) {
    var rtTimer = null;
    var scheduleReload = function () {
      clearTimeout(rtTimer);
      rtTimer = setTimeout(function () { load(true); }, 600);
    };
    try {
      sb.channel('physiotrack-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'attendance' }, scheduleReload)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'physio_profiles' }, scheduleReload)
        .subscribe();
    } catch (e) { /* realtime is optional; the 60s poll below still keeps data fresh */ }

    $('refreshBtn').addEventListener('click', function () { load(true); });
    setInterval(function () { load(true); }, 60000);

    render();
    load(false);
  }
})();
</script>
</body>
</html>
