<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>PhysioTrack - Field Operations Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --blue: #007D9D;
    --blue-dark: #00566D;
    --blue-soft: #E6F4F8;
    --blue-line: #9FD3E1;
    --orange: #F16F21;
    --orange-soft: #FFF1EA;
    --yellow: #FCB913;
    --yellow-ink: #4A3400;
    --green: #1E9E63;
    --green-soft: #E1F5EA;
    --bg: #F4F8FA;
    --card: #FFFFFF;
    --ink: #12232B;
    --muted: #5E727C;
    --border: #DCE6EB;
    --shadow-sm: 0 2px 8px rgba(18, 35, 43, 0.06);
    --shadow-md: 0 10px 28px rgba(0, 71, 90, 0.14);
    --radius: 14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; margin: 0; }
  button, input, select { font-family: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }

  .topbar {
    height: 60px;
    flex-shrink: 0;
    background: #fff;
    border-bottom: 3px solid var(--orange);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    z-index: 1200;
    position: relative;
    box-shadow: var(--shadow-sm);
  }
  .logo {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #fff;
    flex-shrink: 0;
    font-weight: 800;
    color: var(--blue);
    font-size: 14px;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }
  .brand { min-width: 0; }
  .brand-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 15px;
    color: var(--blue-dark);
    white-space: nowrap;
    line-height: 1.2;
  }
  .brand-sub {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.85); }
  }

  .spacer { flex: 1; }
  .top-stats { display: flex; align-items: center; gap: 6px; }
  .stat-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .stat-pill.active { background: var(--green-soft); color: #136F44; }
  .stat-pill.completed { background: var(--blue-soft); color: var(--blue-dark); }
  .stat-pill.missing { background: var(--orange-soft); color: #A8480E; }
  .stat-dot { width: 8px; height: 8px; border-radius: 50%; }

  .range-wrap { position: relative; }
  .range-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 38px;
    padding: 0 12px;
    border: 1px solid var(--blue-line);
    background: var(--blue-soft);
    color: var(--blue-dark);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    transition: background 0.15s, border-color 0.15s;
  }
  .range-btn:hover { background: #D7EEF5; border-color: var(--blue); }

  .refresh-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 17px;
    color: var(--blue-dark);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.2s;
  }
  .refresh-btn:hover { background: var(--blue-soft); border-color: var(--blue-line); }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cal {
    position: absolute;
    right: 0;
    top: 46px;
    width: 296px;
    max-width: calc(100vw - 24px);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
    padding: 14px;
    z-index: 1400;
  }
  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    font-weight: 700;
    font-size: 14px;
    color: var(--blue-dark);
  }
  .cal-head button {
    width: 30px;
    height: 30px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--blue-dark);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-head button:hover { background: var(--blue-soft); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal-dow { font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; }
  .cal-day { height: 34px; border: none; background: none; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink); }
  .cal-day:hover { background: var(--blue-soft); }
  .cal-day.in { background: var(--blue-soft); color: var(--blue-dark); border-radius: 0; font-weight: 600; }
  .cal-day.edge { background: var(--blue); color: #fff; border-radius: 8px; font-weight: 700; }
  .cal-day.today { outline: 2px solid var(--yellow); outline-offset: -2px; }
  .cal-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
  .cal-today-btn {
    border: 1px solid var(--blue-line);
    background: var(--blue-soft);
    color: var(--blue-dark);
    font-weight: 700;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 8px;
  }
  .cal-today-btn:hover { background: var(--blue); color: #fff; }

  .main { flex: 1; display: flex; min-height: 0; position: relative; }
  .map-wrap { flex: 1; min-width: 0; position: relative; display: flex; }
  #map { flex: 1; width: 100%; height: 100%; z-index: 1; }

  .map-legend {
    position: absolute;
    bottom: 16px;
    left: 14px;
    z-index: 800;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 7px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    box-shadow: var(--shadow-sm);
    pointer-events: auto;
  }
  .leg-item { display: inline-flex; align-items: center; gap: 6px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }

  .panel {
    width: 410px;
    max-width: 100%;
    background: #fff;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
    z-index: 10;
  }
  .panel-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    min-height: 58px;
    background: #fff;
  }
  .back-btn {
    height: 34px;
    padding: 0 12px;
    border: 1px solid var(--blue-line);
    background: var(--blue-soft);
    color: var(--blue-dark);
    border-radius: 9px;
    font-size: 12px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .back-btn:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
  .panel-titles { min-width: 0; flex: 1; }
  .panel-head h2 { font-size: 16px; font-weight: 800; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .panel-tools {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: #FAFCFD;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .search-box { position: relative; display: flex; align-items: center; }
  .search-box svg { position: absolute; left: 10px; color: var(--muted); pointer-events: none; }
  .search-input {
    width: 100%;
    height: 36px;
    padding: 0 30px 0 32px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    font-size: 13px;
    color: var(--ink);
    outline: none;
  }
  .search-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 125, 157, 0.12); }
  .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .filter-row::-webkit-scrollbar { height: 0; }
  .fchip {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }
  .fchip.active { background: var(--blue-dark); color: #fff; border-color: var(--blue-dark); }

  .panel-body { flex: 1; overflow-y: auto; padding: 12px 14px 28px; background: var(--bg); }
  .empty {
    padding: 36px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    background: #fff;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  .pcard, .scard {
    display: block;
    width: 100%;
    text-align: left;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px;
    margin-bottom: 10px;
    border-left: 4px solid var(--blue-line);
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .pcard:hover, .scard:hover { background: #F9FDFF; border-color: var(--blue); transform: translateY(-1px); }
  .pcard.st-Active, .scard.st-Active { border-left-color: var(--green); }
  .pcard.st-Completed, .scard.st-Completed { border-left-color: var(--blue); }
  .pcard.st-Missing, .scard.st-Missing { border-left-color: var(--orange); }

  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .pname { font-weight: 700; font-size: 14px; color: var(--ink); line-height: 1.3; }
  .punit { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .meta-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin-top: 9px; font-size: 12px; line-height: 1.4; }
  .meta-k { color: var(--muted); font-weight: 600; }
  .meta-v { color: #243A43; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }

  .chip { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
  .chip.Active { background: var(--green-soft); color: #136F44; }
  .chip.Completed { background: var(--blue-soft); color: var(--blue-dark); }
  .chip.Missing { background: var(--orange-soft); color: #A8480E; }

  .badge {
    background: var(--yellow);
    color: var(--yellow-ink);
    font-size: 11px;
    font-weight: 800;
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .dur { font-weight: 800; color: var(--blue-dark); }

  .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  .sum-box { background: #fff; border: 1px solid var(--blue-line); border-radius: var(--radius); padding: 10px 12px; text-align: center; box-shadow: var(--shadow-sm); }
  .sum-lbl { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .sum-val { font-weight: 800; font-size: 15px; color: var(--blue-dark); margin-top: 3px; }

  .sec { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
  .sec h3 { font-size: 14px; font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; color: var(--ink); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .kv { display: grid; grid-template-columns: 116px 1fr; gap: 7px 10px; font-size: 13px; }
  .kv-k { color: var(--muted); font-weight: 500; }
  .kv-v { font-weight: 600; color: var(--ink); word-break: break-word; }

  .photo-wrap { margin-top: 12px; border-radius: 11px; overflow: hidden; border: 1px solid var(--border); background: var(--blue-soft); position: relative; }
  .photo-wrap img { width: 100%; max-height: 240px; object-fit: cover; display: block; cursor: zoom-in; }
  .photo-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    background: #fff;
    border-top: 1px solid var(--border);
    font-size: 11px;
    font-weight: 700;
    color: var(--blue-dark);
  }
  .photo-bar a { color: var(--blue); text-decoration: none; }
  .nophoto { margin-top: 10px; font-size: 12px; color: var(--muted); background: #F3F7F9; border: 1px dashed var(--border); border-radius: 10px; padding: 10px; text-align: center; }

  .bub {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 3px solid #fff;
    color: #fff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(0, 38, 47, 0.38);
    transition: transform 0.15s ease;
  }
  .bub:hover { transform: scale(1.12); }
  .bub.Active { background: var(--green); }
  .bub.Completed { background: var(--blue); }
  .bub.Missing { background: var(--orange); }
  .bub.in { background: var(--green); }
  .bub.out { background: var(--orange); }

  .leaflet-popup-content-wrapper { border-radius: 14px; box-shadow: var(--shadow-md); }
  .leaflet-popup-content { font-family: 'DM Sans', sans-serif; font-size: 13px; line-height: 1.45; margin: 13px 15px; min-width: 210px; }
  .pop-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .pop-name { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 14px; color: var(--ink); }
  .pop-hosp { font-size: 12px; font-weight: 600; color: var(--blue-dark); margin-bottom: 8px; }
  .pop-row { font-size: 12px; color: #2B424C; margin-top: 3px; }
  .pop-row b { color: var(--muted); }
  .pop-btn { margin-top: 10px; width: 100%; border: none; background: var(--blue); color: #fff; border-radius: 9px; padding: 8px 12px; font-size: 12px; font-weight: 700; }
  .pop-btn:hover { background: var(--blue-dark); }

  .loading {
    position: absolute;
    inset: 60px 0 0 0;
    background: rgba(244, 248, 250, 0.92);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-weight: 700;
    color: var(--blue-dark);
    z-index: 2000;
    padding: 20px;
    text-align: center;
  }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--blue-line); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10, 20, 26, 0.88);
    z-index: 3000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .lightbox img { max-width: 95vw; max-height: 88vh; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.18);
    color: #fff;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @media (max-width: 900px) { .top-stats { display: none; } }
  @media (max-width: 800px) {
    .main { flex-direction: column; }
    .map-wrap { flex: 0 0 43%; min-height: 220px; }
    .panel { width: 100%; border-left: none; border-top: 1px solid var(--border); flex: 1; }
    .brand-sub { display: none; }
    .map-legend { bottom: 8px; left: 8px; padding: 5px 9px; gap: 8px; font-size: 11px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo" id="logo">PT</div>
  <div class="brand">
    <div class="brand-title">Field Operations Map</div>
    <div class="brand-sub"><span class="live-dot"></span><span id="syncText">Connecting...</span></div>
  </div>

  <div class="spacer"></div>
  <div class="top-stats" id="topStats"></div>

  <div class="range-wrap">
    <button class="range-btn" id="rangeBtn" type="button" aria-label="Select date range">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span id="rangeText">Today</span>
    </button>
    <div class="cal hidden" id="cal"></div>
  </div>

  <button class="refresh-btn" id="refreshBtn" title="Refresh data" aria-label="Refresh data" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
  </button>
</header>

<div class="main">
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-legend" id="mapLegend">
      <span class="leg-item"><span class="leg-dot" style="background:var(--green)"></span>Active</span>
      <span class="leg-item"><span class="leg-dot" style="background:var(--blue)"></span>Completed</span>
      <span class="leg-item"><span class="leg-dot" style="background:var(--orange)"></span>Signout missing</span>
    </div>
  </div>

  <aside class="panel">
    <div class="panel-head">
      <button class="back-btn hidden" id="backBtn" type="button">&larr; Back</button>
      <div class="panel-titles">
        <h2 id="panelTitle">Physios</h2>
        <div class="panel-sub" id="panelSub">Loading...</div>
      </div>
    </div>

    <div class="panel-tools" id="panelTools">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="searchInput" type="search" placeholder="Search physio, unit, or Emp ID..." autocomplete="off" />
      </div>
      <div class="filter-row" id="statusFilterRow">
        <button class="fchip active" data-filter="all" type="button">All</button>
        <button class="fchip" data-filter="inrange" type="button">Punched in range</button>
        <button class="fchip" data-filter="Active" type="button">Active</button>
        <button class="fchip" data-filter="Completed" type="button">Completed</button>
        <button class="fchip" data-filter="Missing" type="button">Missing</button>
      </div>
    </div>

    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div id="loadingMsg">Loading attendance data from Supabase...</div>
</div>

<div class="lightbox hidden" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close photo">&times;</button>
  <img id="lightboxImg" src="" alt="Attendance photo" referrerpolicy="no-referrer" />
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
(function () {
  'use strict';

  var CFG = window.PHYSIOTRACK_CONFIG || {};
  var sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);

  var $ = function (id) { return document.getElementById(id); };
  var TZ = CFG.TIMEZONE || 'Asia/Kolkata';
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function todayKey() {
    return new Date().toLocaleDateString('en-CA', { timeZone: TZ });
  }

  function fmtDT(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '-';
    return d.toLocaleString('en-IN', {
      timeZone: TZ, day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: true
    });
  }

  function fmtTimeOnly(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '-';
    return d.toLocaleTimeString('en-IN', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: true });
  }

  function fmtDay(key) {
    if (!key) return '-';
    var p = String(key).split('-');
    if (p.length !== 3) return key;
    return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1].slice(0, 3) + ' ' + p[0];
  }

  function statusOf(r) {
    if (!r) return 'Active';
    return r.signOutTime ? 'Completed' : (r.note === 'Signout Missing' ? 'Missing' : 'Active');
  }

  function statusLabel(r) {
    var s = statusOf(r);
    return s === 'Missing' ? 'Signout missing' : s;
  }

  function elapsed(r) {
    var t = new Date(r.signInTime).getTime();
    if (isNaN(t)) return '-';
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    return (m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + 'm') + ' (running)';
  }

  function durOf(r) {
    if (!r) return '-';
    return r.signOutTime ? (r.duration || '-') : (statusOf(r) === 'Active' ? elapsed(r) : '-');
  }

  function initials(n) {
    var parts = String(n || '?').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
  }

  function validPt(lat, lng) {
    if (lat == null || lng == null || lat === '' || lng === '') return false;
    var a = Number(lat), b = Number(lng);
    return isFinite(a) && isFinite(b) && !(a === 0 && b === 0) && Math.abs(a) <= 90 && Math.abs(b) <= 180;
  }

  function haversineKm(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var km = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(2) + ' km';
  }

  var S = {
    profiles: [],
    att: [],
    logo: '',
    from: todayKey(),
    to: todayKey(),
    pending: false,
    view: 'list',
    empId: '',
    shiftId: '',
    calMonth: null,
    search: '',
    filter: 'all',
    hasFittedOnce: false
  };

  var map = L.map('map', { zoomControl: true }).setView([17.385, 78.4867], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  var layer = L.layerGroup().addTo(map);

  function bubble(cls, text, lat, lng) {
    return L.marker([lat, lng], {
      icon: L.divIcon({
        className: '',
        html: '<div class="bub ' + cls + '">' + esc(text) + '</div>',
        iconSize: [38, 38],
        iconAnchor: [19, 19],
        popupAnchor: [0, -20]
      })
    });
  }

  function spreadCoord(lat, lng, seenMap) {
    var key = lat.toFixed(5) + ',' + lng.toFixed(5);
    var count = seenMap[key] || 0;
    seenMap[key] = count + 1;
    if (count === 0) return [lat, lng];
    var angle = count * 2.39996;
    var offset = 0.00018 * Math.sqrt(count);
    return [lat + Math.cos(angle) * offset, lng + Math.sin(angle) * offset];
  }

  function popupHtml(r) {
    var st = statusOf(r);
    var outHtml = r.signOutTime
      ? '<div class="pop-row"><b>Logout:</b> ' + esc(fmtDT(r.signOutTime)) + '</div>' +
        '<div class="pop-row"><b>Out Loc:</b> ' + esc(r.signOutLocation || '-') + '</div>'
      : '<div class="pop-row"><b>Logout:</b> ' + esc(statusLabel(r)) + '</div>';
    return (
      '<div class="pop-head">' +
        '<span class="pop-name">' + esc(r.physioName) + '</span>' +
        '<span class="chip ' + st + '">' + esc(statusLabel(r)) + '</span>' +
      '</div>' +
      '<div class="pop-hosp">' + esc(r.hospitalName || 'Hospital not entered') + '</div>' +
      '<div class="pop-row"><b>Login:</b> ' + esc(fmtDT(r.signInTime)) + '</div>' +
      outHtml +
      '<div class="pop-row"><b>Duration:</b> <span class="dur">' + esc(durOf(r)) + '</span></div>' +
      '<button class="pop-btn" data-open="' + esc(r.id) + '" type="button">View details</button>'
    );
  }

  function drawMap(preserveViewport) {
    layer.clearLayers();
    var pts = [];
    var seen = {};

    if (S.view === 'detail') {
      var r = byId(S.shiftId);
      if (r) {
        if (validPt(r.signInLat, r.signInLng)) {
          var pIn = [Number(r.signInLat), Number(r.signInLng)];
          bubble('in', 'IN', pIn[0], pIn[1])
            .bindPopup('<b>Sign in</b><br>' + esc(fmtDT(r.signInTime)) + '<br>' + esc(r.signInLocation || '-'))
            .addTo(layer);
          pts.push(pIn);
        }
        if (r.signOutTime && validPt(r.signOutLat, r.signOutLng)) {
          var pOut = [Number(r.signOutLat), Number(r.signOutLng)];
          if (pts.length && Math.abs(pts[0][0] - pOut[0]) < 0.00003 && Math.abs(pts[0][1] - pOut[1]) < 0.00003) {
            pOut = [pOut[0] + 0.00015, pOut[1] + 0.00015];
          }
          bubble('out', 'OUT', pOut[0], pOut[1])
            .bindPopup('<b>Sign out</b><br>' + esc(fmtDT(r.signOutTime)) + '<br>' + esc(r.signOutLocation || '-'))
            .addTo(layer);
          pts.push(pOut);
          if (pts.length === 2) {
            L.polyline(pts, { color: '#007D9D', weight: 3, dashArray: '7 8', opacity: 0.9 }).addTo(layer);
          }
        }
      }
    } else {
      var list = S.view === 'shifts' ? shiftsFor(S.empId) : S.att.filter(inRange);
      list.forEach(function (r) {
        if (!validPt(r.signInLat, r.signInLng)) return;
        var coord = spreadCoord(Number(r.signInLat), Number(r.signInLng), seen);
        var m = bubble(statusOf(r), initials(r.physioName), coord[0], coord[1]);
        m.bindPopup(popupHtml(r));
        m.addTo(layer);
        pts.push(coord);
      });
    }

    if (!preserveViewport || !S.hasFittedOnce) {
      if (pts.length === 1) {
        map.setView(pts[0], 15);
        S.hasFittedOnce = true;
      } else if (pts.length > 1) {
        var bounds = L.latLngBounds(pts);
        if (bounds.getNorthEast().distanceTo(bounds.getSouthWest()) < 30) {
          map.setView(pts[0], 16);
        } else {
          map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
        }
        S.hasFittedOnce = true;
      }
    }
    setTimeout(function () { map.invalidateSize(); }, 60);
  }

  map.getContainer().addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-open]');
    if (b) openShift(b.getAttribute('data-open'));
  });

  function byId(id) { return S.att.find(function (r) { return r.id === id; }); }
  function inRange(r) { return r.signInDate >= S.from && r.signInDate <= S.to; }
  function shiftsFor(emp) {
    return S.att.filter(function (r) { return r.empId === emp; })
      .sort(function (a, b) { return new Date(b.signInTime) - new Date(a.signInTime); });
  }
  function profileOf(emp) {
    return S.profiles.find(function (p) { return p.empId === emp; }) || { name: emp, unit: '', empId: emp };
  }

  function renderTopStats() {
    var rangeAtt = S.att.filter(inRange);
    var act = 0, comp = 0, miss = 0;
    rangeAtt.forEach(function (r) {
      var st = statusOf(r);
      if (st === 'Active') act++;
      else if (st === 'Completed') comp++;
      else miss++;
    });
    $('topStats').innerHTML =
      '<span class="stat-pill active"><span class="stat-dot" style="background:var(--green)"></span>' + act + ' Active</span>' +
      '<span class="stat-pill completed"><span class="stat-dot" style="background:var(--blue)"></span>' + comp + ' Completed</span>' +
      '<span class="stat-pill missing"><span class="stat-dot" style="background:var(--orange)"></span>' + miss + ' Missing</span>';
  }

  function render() {
    var back = $('backBtn');
    var body = $('panelBody');
    var tools = $('panelTools');
    var tk = todayKey();

    $('rangeText').textContent = S.from === S.to
      ? (S.from === tk ? 'Today · ' : '') + fmtDay(S.from)
      : fmtDay(S.from) + ' – ' + fmtDay(S.to);

    renderTopStats();

    if (S.view === 'list') {
      back.classList.add('hidden');
      tools.classList.remove('hidden');

      var rangeAtt = S.att.filter(inRange);
      $('panelTitle').textContent = 'Physios (' + S.profiles.length + ')';
      $('panelSub').textContent = rangeAtt.length + ' login' + (rangeAtt.length === 1 ? '' : 's') + ' on map for selected dates';

      if (!S.profiles.length) {
        body.innerHTML = '<div class="empty">No physio profiles found in Supabase yet. Sync your <b>Physio Profiles</b> sheet first.</div>';
        return;
      }

      var q = S.search.trim().toLowerCase();
      var filtered = S.profiles.filter(function (p) {
        var all = shiftsFor(p.empId);
        var last = all[0];
        var cnt = all.filter(inRange).length;

        if (S.filter === 'inrange' && cnt === 0) return false;
        if (S.filter === 'Active' || S.filter === 'Completed' || S.filter === 'Missing') {
          if (!last || statusOf(last) !== S.filter) return false;
        }
        if (q) {
          var hay = (p.name + ' ' + p.unit + ' ' + p.empId + ' ' + (last ? last.hospitalName : '')).toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });

      if (!filtered.length) {
        body.innerHTML = '<div class="empty">No physios match your current search or filter.</div>';
        return;
      }

      body.innerHTML = filtered.map(function (p) {
        var all = shiftsFor(p.empId);
        var last = all[0];
        var cnt = all.filter(inRange).length;
        var st = last ? statusOf(last) : 'None';

        var detail = last
          ? '<div class="meta-grid">' +
              '<span class="meta-k">Last login</span><span class="meta-v">' + esc(fmtDT(last.signInTime)) + '</span>' +
              '<span class="meta-k">Last logout</span><span class="meta-v">' + (last.signOutTime ? esc(fmtDT(last.signOutTime)) : esc(statusLabel(last))) + '</span>' +
              '<span class="meta-k">Duration</span><span class="meta-v dur">' + esc(durOf(last)) + '</span>' +
            '</div>'
          : '<div class="meta-grid"><span class="meta-k">Status</span><span class="meta-v" style="color:var(--muted)">No shifts punched yet</span></div>';

        return (
          '<button class="pcard st-' + st + '" type="button" data-emp="' + esc(p.empId) + '">' +
            '<div class="row">' +
              '<div>' +
                '<div class="pname">' + esc(p.name) + '</div>' +
                '<div class="punit">' + esc(p.unit || 'No unit') + ' &middot; ' + esc(p.empId) + '</div>' +
              '</div>' +
              (cnt ? '<span class="badge">' + cnt + ' in range</span>' : '') +
            '</div>' +
            detail +
          '</button>'
        );
      }).join('');

    } else if (S.view === 'shifts') {
      back.classList.remove('hidden');
      tools.classList.add('hidden');

      var p = profileOf(S.empId);
      var list = shiftsFor(S.empId);
      $('panelTitle').textContent = p.name;
      $('panelSub').textContent = (p.unit ? p.unit + ' · ' : '') + list.length + ' shift' + (list.length === 1 ? '' : 's') + ' (latest first)';

      body.innerHTML = list.length ? list.map(function (r) {
        var st = statusOf(r);
        return (
          '<button class="scard st-' + st + '" type="button" data-shift="' + esc(r.id) + '">' +
            '<div class="row">' +
              '<div class="pname">' + esc(r.hospitalName || 'Hospital not entered') + '</div>' +
              '<span class="chip ' + st + '">' + esc(statusLabel(r)) + '</span>' +
            '</div>' +
            '<div class="meta-grid">' +
              '<span class="meta-k">Login</span><span class="meta-v">' + esc(fmtDT(r.signInTime)) + '</span>' +
              '<span class="meta-k">Logout</span><span class="meta-v">' + (r.signOutTime ? esc(fmtDT(r.signOutTime)) : '-') + '</span>' +
              '<span class="meta-k">Duration</span><span class="meta-v dur">' + esc(durOf(r)) + '</span>' +
            '</div>' +
          '</button>'
        );
      }).join('') : '<div class="empty">No attendance punched for this physio yet.</div>';

    } else {
      back.classList.remove('hidden');
      tools.classList.add('hidden');

      var r = byId(S.shiftId);
      if (!r) {
        body.innerHTML = '<div class="empty">Shift not found.</div>';
        return;
      }

      $('panelTitle').textContent = r.physioName;
      $('panelSub').textContent = (r.unit ? r.unit + ' · ' : '') + fmtDay(r.signInDate);

      var distNote = '';
      if (r.signOutTime && validPt(r.signInLat, r.signInLng) && validPt(r.signOutLat, r.signOutLng)) {
        distNote = ' &middot; ' + haversineKm(Number(r.signInLat), Number(r.signInLng), Number(r.signOutLat), Number(r.signOutLng)) + ' apart';
      }

      body.innerHTML =
        '<div class="summary">' +
          '<div class="sum-box"><div class="sum-lbl">Status</div><div class="sum-val">' + esc(statusLabel(r)) + '</div></div>' +
          '<div class="sum-box"><div class="sum-lbl">Duration</div><div class="sum-val">' + esc(durOf(r)) + '</div></div>' +
        '</div>' +

        '<div class="sec">' +
          '<h3><span class="dot" style="background:var(--green)"></span>Sign in</h3>' +
          '<div class="kv">' +
            '<span class="kv-k">Date &amp; time</span><span class="kv-v">' + esc(fmtDT(r.signInTime)) + '</span>' +
            '<span class="kv-k">Location</span><span class="kv-v">' + esc(r.signInLocation || '-') + '</span>' +
            '<span class="kv-k">Hospital</span><span class="kv-v">' + esc(r.hospitalName || '-') + '</span>' +
          '</div>' +
          photoHtml(r.signInPhoto, 'Sign-in photo') +
        '</div>' +

        '<div class="sec">' +
          '<h3><span class="dot" style="background:var(--orange)"></span>Sign out</h3>' +
          (r.signOutTime ? (
            '<div class="kv">' +
              '<span class="kv-k">Date &amp; time</span><span class="kv-v">' + esc(fmtDT(r.signOutTime)) + '</span>' +
              '<span class="kv-k">Location</span><span class="kv-v">' + esc(r.signOutLocation || '-') + distNote + '</span>' +
              '<span class="kv-k">PRE name</span><span class="kv-v">' + esc(r.preName || '-') + '</span>' +
              '<span class="kv-k">Patients visited</span><span class="kv-v">' + esc(r.patientsVisited || '-') + '</span>' +
              '<span class="kv-k">Assessments done</span><span class="kv-v">' + esc(r.assessmentsDone || '-') + '</span>' +
              '<span class="kv-k">Converted</span><span class="kv-v">' + esc(r.converted || '-') + '</span>' +
              '<span class="kv-k">Remarks</span><span class="kv-v">' + esc(r.remarks || '-') + '</span>' +
            '</div>' +
            photoHtml(r.signOutPhoto, 'Sign-out photo')
          ) : '<div class="nophoto">Not signed out yet (' + esc(statusLabel(r)) + ').</div>') +
        '</div>';
    }
  }

  function photoHtml(url, label) {
    if (!url) {
      return '<div class="nophoto">Photo not available (still uploading or not taken).</div>';
    }
    return (
      '<div class="photo-wrap">' +
        '<img src="' + esc(url) + '" alt="' + esc(label) + '" referrerpolicy="no-referrer" loading="lazy" ' +
          'data-zoom="' + esc(url) + '" ' +
          'onerror="this.parentNode.outerHTML=\'<div class=nophoto>Photo could not be loaded.</div>\'" />' +
        '<div class="photo-bar"><span>' + esc(label) + '</span><a href="' + esc(url) + '" target="_blank" rel="noopener">Open Photo &nearr;</a></div>' +
      '</div>'
    );
  }

  var prevView = 'list';

  function openProfile(emp) {
    S.empId = emp;
    S.view = 'shifts';
    render();
    drawMap(false);
    $('panelBody').scrollTop = 0;
  }

  function openShift(id) {
    var r = byId(id);
    if (!r) return;
    prevView = (S.view === 'shifts' && S.empId === r.empId) ? 'shifts' : 'list';
    if (prevView === 'list') S.empId = r.empId;
    S.shiftId = id;
    S.view = 'detail';
    map.closePopup();
    render();
    drawMap(false);
    $('panelBody').scrollTop = 0;
  }

  $('backBtn').addEventListener('click', function () {
    if (S.view === 'detail') {
      S.view = (prevView === 'shifts') ? 'shifts' : 'list';
    } else {
      S.view = 'list';
    }
    render();
    drawMap(false);
  });

  $('panelBody').addEventListener('click', function (e) {
    var zoomImg = e.target.closest && e.target.closest('[data-zoom]');
    if (zoomImg) {
      $('lightboxImg').src = zoomImg.getAttribute('data-zoom');
      $('lightbox').classList.remove('hidden');
      return;
    }
    var s = e.target.closest && e.target.closest('[data-shift]');
    if (s) return openShift(s.getAttribute('data-shift'));
    var p = e.target.closest && e.target.closest('[data-emp]');
    if (p) openProfile(p.getAttribute('data-emp'));
  });

  $('lightbox').addEventListener('click', function () {
    $('lightbox').classList.add('hidden');
    $('lightboxImg').src = '';
  });

  $('searchInput').addEventListener('input', function (e) {
    S.search = e.target.value || '';
    render();
  });

  $('statusFilterRow').addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('[data-filter]');
    if (!btn) return;
    S.filter = btn.getAttribute('data-filter');
    var btns = $('statusFilterRow').querySelectorAll('.fchip');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', btns[i] === btn);
    }
    render();
  });

  function keyOf(y, m, d) {
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }

  function drawCal() {
    var cm = S.calMonth, y = cm.y, m = cm.m, tk = todayKey();
    var first = new Date(y, m, 1).getDay();
    var days = new Date(y, m + 1, 0).getDate();

    var h = '<div class="cal-head">' +
      '<button type="button" data-nav="-1" aria-label="Previous month">&lsaquo;</button>' +
      '<span>' + MONTHS[m] + ' ' + y + '</span>' +
      '<button type="button" data-nav="1" aria-label="Next month">&rsaquo;</button>' +
      '</div><div class="cal-grid">';

    ['S','M','T','W','T','F','S'].forEach(function (d) { h += '<div class="cal-dow">' + d + '</div>'; });
    for (var i = 0; i < first; i++) h += '<div></div>';
    for (var d = 1; d <= days; d++) {
      var k = keyOf(y, m, d), cls = 'cal-day';
      if (k === S.from || k === S.to) cls += ' edge';
      else if (k > S.from && k < S.to) cls += ' in';
      if (k === tk) cls += ' today';
      h += '<button type="button" class="' + cls + '" data-day="' + k + '">' + d + '</button>';
    }
    h += '</div><div class="cal-foot">' +
      '<span>' + (S.pending ? 'Tap end date (or same day)' : 'Tap start date, then end date') + '</span>' +
      '<button class="cal-today-btn" type="button" data-today="1">Today</button>' +
      '</div>';

    $('cal').innerHTML = h;
  }

  function toggleCal(show) {
    var c = $('cal');
    if (show === undefined) show = c.classList.contains('hidden');
    if (show) {
      var p = S.from.split('-');
      S.calMonth = { y: Number(p[0]), m: Number(p[1]) - 1 };
      S.pending = false;
      drawCal();
      c.classList.remove('hidden');
    } else {
      c.classList.add('hidden');
      S.pending = false;
    }
  }

  $('rangeBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    toggleCal();
  });

  $('cal').addEventListener('click', function (e) {
    e.stopPropagation();
    var t = e.target;
    if (t.getAttribute('data-nav')) {
      S.calMonth.m += Number(t.getAttribute('data-nav'));
      if (S.calMonth.m < 0) { S.calMonth.m = 11; S.calMonth.y--; }
      if (S.calMonth.m > 11) { S.calMonth.m = 0; S.calMonth.y++; }
      return drawCal();
    }
    if (t.getAttribute('data-today')) {
      S.from = S.to = todayKey();
      toggleCal(false);
      return afterRange();
    }
    var day = t.getAttribute('data-day');
    if (!day) return;
    if (!S.pending) {
      S.from = S.to = day;
      S.pending = true;
      drawCal();
      render();
    } else {
      if (day < S.from) { S.to = S.from; S.from = day; }
      else { S.to = day; }
      toggleCal(false);
      afterRange();
    }
  });

  document.addEventListener('click', function () { toggleCal(false); });

  function afterRange() {
    if (S.view !== 'list') S.view = 'list';
    render();
    drawMap(false);
  }

  /* ---------------- Direct Supabase Data Loading ---------------- */
  async function fetchAllAttendance() {
    var all = [];
    var pageSize = 1000;
    var from = 0;
    while (true) {
      var res = await sb
        .from('attendance')
        .select('*')
        .order('sign_in_time', { ascending: false })
        .range(from, from + pageSize - 1);
      if (res.error) throw res.error;
      var chunk = res.data || [];
      all = all.concat(chunk);
      if (chunk.length < pageSize) break;
      from += pageSize;
    }
    return all;
  }

  function mapAttendanceRow(r, tk) {
    var signOutTime = r.sign_out_time || null;
    var status = signOutTime
      ? 'Completed'
      : (r.sign_in_date < tk ? 'Signout Missing' : 'Active');
    return {
      id: String(r.id),
      empId: String(r.emp_id || ''),
      physioName: String(r.physio_name || ''),
      unit: String(r.unit || ''),
      signInDate: String(r.sign_in_date || ''),
      signInTime: String(r.sign_in_time || ''),
      signInLocation: String(r.sign_in_location || ''),
      signInLat: Number(r.sign_in_lat || 0),
      signInLng: Number(r.sign_in_lng || 0),
      hospitalName: String(r.hospital_name || ''),
      signInPhoto: String(r.sign_in_photo || ''),
      signOutTime: signOutTime,
      signOutLocation: r.sign_out_location || null,
      signOutLat: r.sign_out_lat != null ? Number(r.sign_out_lat) : null,
      signOutLng: r.sign_out_lng != null ? Number(r.sign_out_lng) : null,
      preName: String(r.pre_name || ''),
      patientsVisited: String(r.patients_visited || ''),
      assessmentsDone: String(r.assessments_done || ''),
      converted: String(r.converted || ''),
      remarks: String(r.remarks || ''),
      signOutPhoto: r.sign_out_photo || null,
      duration: String(r.duration || ''),
      note: status
    };
  }

  async function load(isAutoRefresh) {
    $('refreshBtn').classList.add('spinning');
    try {
      var tk = todayKey();
      var [profRes, attRows, setRes] = await Promise.all([
        sb.from('physio_profiles').select('emp_id, name, unit').order('name', { ascending: true }),
        fetchAllAttendance(),
        sb.from('app_settings').select('value').eq('key', 'logo_url').maybeSingle()
      ]);

      if (profRes.error) throw profRes.error;

      S.profiles = (profRes.data || []).map(function (p) {
        return { unit: p.unit || '', name: p.name || '', empId: p.emp_id || '' };
      });
      S.att = attRows.map(function (r) { return mapAttendanceRow(r, tk); });

      var logoUrl = (setRes.data && setRes.data.value) || '';
      if (logoUrl && logoUrl !== S.logo) {
        S.logo = logoUrl;
        $('logo').innerHTML = '<img src="' + esc(S.logo) + '" referrerpolicy="no-referrer" alt="Logo" />';
        $('logo').firstChild.onerror = function () { $('logo').textContent = 'PT'; };
      }

      $('loading').classList.add('hidden');
      $('refreshBtn').classList.remove('spinning');
      $('syncText').textContent = 'Live · ' + fmtTimeOnly(new Date().toISOString());

      render();
      drawMap(Boolean(isAutoRefresh));
    } catch (err) {
      $('refreshBtn').classList.remove('spinning');
      $('loadingMsg').textContent = 'Could not load Supabase data: ' + (err && err.message ? err.message : err);
      $('syncText').textContent = 'Sync error';
    }
  }

  // Subscribe to live database changes so managers see punches instantly
  var rtTimer = null;
  function scheduleReload() {
    clearTimeout(rtTimer);
    rtTimer = setTimeout(function () { load(true); }, 600);
  }
  sb.channel('physiotrack-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'attendance' }, scheduleReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'physio_profiles' }, scheduleReload)
    .subscribe();

  $('refreshBtn').addEventListener('click', function () { load(true); });
  setInterval(function () { load(true); }, 60000);

  render();
  load(false);
})();
</script>
</body>
</html>
