<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>PhysioTrack - Attendance Punch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --blue: #007D9D;
    --blue-dark: #00566D;
    --blue-soft: #E6F4F8;
    --blue-line: #9FD3E1;
    --orange: #F16F21;
    --orange-soft: #FFF1EA;
    --yellow: #FCB913;
    --green: #1E9E63;
    --green-soft: #E1F5EA;
    --red: #D63B3B;
    --red-soft: #FDECEC;
    --bg: #F4F8FA;
    --card: #FFFFFF;
    --ink: #12232B;
    --muted: #5E727C;
    --border: #DCE6EB;
    --shadow-sm: 0 2px 8px rgba(18, 35, 43, 0.06);
    --shadow-md: 0 10px 28px rgba(0, 71, 90, 0.12);
    --radius: 16px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    padding-bottom: 40px;
  }
  h1, h2, h3 { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; margin: 0; }
  button, input, select, textarea { font-family: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }

  .topbar {
    height: 60px;
    background: #fff;
    border-bottom: 3px solid var(--orange);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm);
  }
  .logo {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #fff;
    flex-shrink: 0;
    font-weight: 800;
    color: var(--blue);
    font-size: 14px;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }
  .brand-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 15px; color: var(--blue-dark); }
  .brand-sub { font-size: 11px; color: var(--muted); }
  .spacer { flex: 1; }
  .clock-pill {
    background: var(--blue-soft);
    color: var(--blue-dark);
    border: 1px solid var(--blue-line);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }

  .wrap { max-width: 520px; margin: 16px auto 0; padding: 0 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
  }
  .card-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .field { margin-bottom: 13px; }
  .field:last-child { margin-bottom: 0; }
  .label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .input, .select, .textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 11px 12px;
    font-size: 14px;
    color: var(--ink);
    background: #fff;
    outline: none;
  }
  .input:focus, .select:focus, .textarea:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(0, 125, 157, 0.12);
  }
  .textarea { min-height: 76px; resize: vertical; }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

  .profile-pill {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    background: var(--blue-soft);
    border: 1px solid var(--blue-line);
    border-radius: 12px;
    margin-top: 10px;
    font-size: 13px;
  }
  .profile-pill b { color: var(--blue-dark); }

  .active-banner {
    background: var(--green-soft);
    border: 1px solid #9BD9BA;
    border-left: 5px solid var(--green);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .active-banner .ab-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .ab-badge {
    background: var(--green);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .ab-timer { font-weight: 800; font-size: 14px; color: #136F44; }
  .ab-meta { font-size: 13px; color: #184931; line-height: 1.5; }

  .gps-box {
    background: #F8FBFD;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 12px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
  }
  .gps-text { line-height: 1.4; color: var(--ink); word-break: break-word; }
  .gps-coords { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .mini-btn {
    border: 1px solid var(--blue-line);
    background: var(--blue-soft);
    color: var(--blue-dark);
    border-radius: 9px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .photo-box {
    border: 2px dashed var(--blue-line);
    background: #F8FBFD;
    border-radius: 13px;
    padding: 14px;
    text-align: center;
  }
  .photo-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--blue-soft);
    color: var(--blue-dark);
    border: 1px solid var(--blue-line);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .photo-preview {
    margin-top: 12px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .photo-preview img {
    width: 100%;
    max-height: 240px;
    object-fit: cover;
    display: block;
  }
  .photo-meta {
    font-size: 11px;
    font-weight: 700;
    color: var(--green);
    background: #fff;
    padding: 6px 10px;
    border-top: 1px solid var(--border);
  }

  .submit-btn {
    width: 100%;
    border: none;
    border-radius: 13px;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    background: var(--blue);
    box-shadow: var(--shadow-sm);
    margin-top: 6px;
  }
  .submit-btn:hover { background: var(--blue-dark); }
  .submit-btn.out { background: var(--orange); }
  .submit-btn.out:hover { background: #D85B10; }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .toast {
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .toast.ok { background: var(--green-soft); color: #136F44; border: 1px solid #9BD9BA; }
  .toast.err { background: var(--red-soft); color: var(--red); border: 1px solid #F3B7B7; }

  .history-item {
    border: 1px solid var(--border);
    border-left: 4px solid var(--blue);
    border-radius: 12px;
    padding: 11px 12px;
    margin-bottom: 8px;
    font-size: 12px;
    background: #FCFEFF;
  }
  .history-item.Active { border-left-color: var(--green); }
  .history-item.Missing { border-left-color: var(--orange); }
  .h-top { display: flex; justify-content: space-between; font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .h-sub { color: var(--muted); line-height: 1.45; }

  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(244, 248, 250, 0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    z-index: 500;
    font-weight: 700;
    color: var(--blue-dark);
  }
  .spinner {
    width: 34px;
    height: 34px;
    border: 3px solid var(--blue-line);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo" id="logo">PT</div>
  <div>
    <div class="brand-title">PhysioTrack Punch</div>
    <div class="brand-sub">Field Attendance</div>
  </div>
  <div class="spacer"></div>
  <div class="clock-pill" id="clockPill">--:--</div>
</header>

<main class="wrap">
  <div class="toast hidden" id="toast"></div>

  <!-- Physio Selector -->
  <section class="card">
    <div class="card-title">
      <span>Select Physio</span>
      <button class="mini-btn" id="refreshBtn" type="button">Refresh</button>
    </div>
    <div class="field">
      <input class="input" id="profileSearch" type="search" placeholder="Filter by name, unit, or Emp ID..." autocomplete="off" />
    </div>
    <div class="field">
      <select class="select" id="profileSelect">
        <option value="">-- Choose your name --</option>
      </select>
    </div>
    <div class="profile-pill hidden" id="profileMeta"></div>
  </section>

  <!-- Active Shift Banner -->
  <section class="active-banner hidden" id="activeBanner">
    <div class="ab-top">
      <span class="ab-badge">SHIFT ACTIVE</span>
      <span class="ab-timer" id="activeTimer">0m</span>
    </div>
    <div class="ab-meta" id="activeMeta"></div>
  </section>

  <!-- SIGN IN FORM -->
  <section class="card hidden" id="signInCard">
    <div class="card-title">Sign In (Start Shift)</div>

    <div class="field">
      <label class="label" for="hospitalInput">Hospital Name *</label>
      <input class="input" id="hospitalInput" type="text" placeholder="Enter hospital / clinic name" required />
    </div>

    <div class="field">
      <label class="label">Current GPS Location *</label>
      <div class="gps-box">
        <div style="min-width:0;flex:1">
          <div class="gps-text" id="inGpsText">Tap Refresh GPS to capture location</div>
          <div class="gps-coords" id="inGpsCoords"></div>
        </div>
        <button class="mini-btn" id="inGpsBtn" type="button">Refresh GPS</button>
      </div>
    </div>

    <div class="field">
      <label class="label">Sign-In Selfie / Photo * (Auto-Compressed)</label>
      <div class="photo-box">
        <label class="photo-btn" for="inPhotoInput">Take / Upload Photo</label>
        <input class="hidden" id="inPhotoInput" type="file" accept="image/*" capture="user" />
        <div class="photo-preview hidden" id="inPhotoPreview">
          <img id="inPhotoImg" src="" alt="Sign-in preview" />
          <div class="photo-meta" id="inPhotoMeta"></div>
        </div>
      </div>
    </div>

    <button class="submit-btn" id="signInBtn" type="button">Punch Sign In</button>
  </section>

  <!-- SIGN OUT FORM -->
  <section class="card hidden" id="signOutCard">
    <div class="card-title">Sign Out (End Shift)</div>

    <div class="field">
      <label class="label" for="preNameInput">PRE Name</label>
      <input class="input" id="preNameInput" type="text" placeholder="Enter PRE name" />
    </div>

    <div class="row-3 field">
      <div>
        <label class="label" for="visitedInput">Visited</label>
        <input class="input" id="visitedInput" type="number" min="0" inputmode="numeric" placeholder="0" />
      </div>
      <div>
        <label class="label" for="assessedInput">Assessed</label>
        <input class="input" id="assessedInput" type="number" min="0" inputmode="numeric" placeholder="0" />
      </div>
      <div>
        <label class="label" for="convertedInput">Converted</label>
        <input class="input" id="convertedInput" type="number" min="0" inputmode="numeric" placeholder="0" />
      </div>
    </div>

    <div class="field">
      <label class="label" for="remarksInput">Remarks</label>
      <textarea class="textarea" id="remarksInput" placeholder="Visit summary / remarks..."></textarea>
    </div>

    <div class="field">
      <label class="label">Sign-Out GPS Location *</label>
      <div class="gps-box">
        <div style="min-width:0;flex:1">
          <div class="gps-text" id="outGpsText">Tap Refresh GPS to capture location</div>
          <div class="gps-coords" id="outGpsCoords"></div>
        </div>
        <button class="mini-btn" id="outGpsBtn" type="button">Refresh GPS</button>
      </div>
    </div>

    <div class="field">
      <label class="label">Sign-Out Selfie / Photo * (Auto-Compressed)</label>
      <div class="photo-box">
        <label class="photo-btn" for="outPhotoInput">Take / Upload Photo</label>
        <input class="hidden" id="outPhotoInput" type="file" accept="image/*" capture="user" />
        <div class="photo-preview hidden" id="outPhotoPreview">
          <img id="outPhotoImg" src="" alt="Sign-out preview" />
          <div class="photo-meta" id="outPhotoMeta"></div>
        </div>
      </div>
    </div>

    <button class="submit-btn out" id="signOutBtn" type="button">Punch Sign Out</button>
  </section>

  <!-- Recent Shifts -->
  <section class="card hidden" id="historyCard">
    <div class="card-title">Recent Shifts</div>
    <div id="historyList"></div>
  </section>
</main>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div id="loadingMsg">Connecting to Supabase...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
(function () {
  'use strict';

  // Support legacy ?page=map links seamlessly
  var params = new URLSearchParams(window.location.search);
  if (params.get('page') === 'map' || params.get('map') === '1') {
    window.location.replace('/map');
    return;
  }

  var CFG = window.PHYSIOTRACK_CONFIG || {};
  var TZ = CFG.TIMEZONE || 'Asia/Kolkata';
  var BUCKET = CFG.STORAGE_BUCKET || 'attendance-photos';
  var sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function todayKey() {
    return new Date().toLocaleDateString('en-CA', { timeZone: TZ });
  }

  function fmtDT(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '-';
    return d.toLocaleString('en-IN', {
      timeZone: TZ, day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: true
    });
  }

  function formatDuration(startIso, endIso) {
    var s = new Date(startIso).getTime();
    var e = new Date(endIso).getTime();
    if (isNaN(s) || isNaN(e) || e < s) return '0m';
    var mins = Math.round((e - s) / 60000);
    var h = Math.floor(mins / 60);
    var m = mins % 60;
    return h > 0 ? (h + 'h ' + m + 'm') : (m + 'm');
  }

  function sanitizePart(str) {
    return String(str || 'USER').replace(/[^a-zA-Z0-9_-]/g, '');
  }

  function showToast(msg, type) {
    var el = $('toast');
    el.textContent = msg;
    el.className = 'toast ' + (type === 'err' ? 'err' : 'ok');
    el.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function hideToast() {
    $('toast').classList.add('hidden');
  }

  function updateClock() {
    $('clockPill').textContent = new Date().toLocaleTimeString('en-IN', {
      timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: true
    });
    if (state.activeShift) {
      $('activeTimer').textContent = formatDuration(state.activeShift.sign_in_time, new Date().toISOString()) + ' running';
    }
  }

  var state = {
    profiles: [],
    selectedEmpId: localStorage.getItem('pt_emp_id') || '',
    activeShift: null,
    recentShifts: [],
    gps: { lat: 0, lng: 0, address: '', ready: false },
    inPhotoBlob: null,
    outPhotoBlob: null
  };

  /* ---------------- Image Compression (Canvas -> JPEG ~50-120 KB) ---------------- */
  function compressImage(file, maxSide, quality) {
    maxSide = maxSide || 960;
    quality = quality || 0.65;
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Could not read image file')); };
      reader.onload = function (ev) {
        var img = new Image();
        img.onerror = function () { reject(new Error('Invalid image file')); };
        img.onload = function () {
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          var scale = Math.min(1, maxSide / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));

          var canvas = document.createElement('canvas');
          canvas.width = cw;
          canvas.height = ch;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, cw, ch);

          canvas.toBlob(function (blob) {
            if (!blob) return reject(new Error('Image compression failed'));
            // If still > 160 KB, re-compress slightly tighter
            if (blob.size > 160 * 1024 && quality > 0.45) {
              canvas.toBlob(function (smaller) {
                resolve(smaller || blob);
              }, 'image/jpeg', 0.48);
            } else {
              resolve(blob);
            }
          }, 'image/jpeg', quality);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function uploadCompressedPhoto(blob, kind, empId) {
    var now = Date.now();
    var tk = todayKey();
    var prefix = kind === 'out' ? 'SIGNOUT' : 'SIGNIN';
    var filePath = tk + '/' + prefix + '_' + sanitizePart(empId) + '_' + now + '.jpg';

    var up = await sb.storage.from(BUCKET).upload(filePath, blob, {
      contentType: 'image/jpeg',
      cacheControl: '31536000',
      upsert: false
    });
    if (up.error) throw new Error('Photo upload failed: ' + up.error.message);

    var pub = sb.storage.from(BUCKET).getPublicUrl(filePath);
    return pub.data.publicUrl;
  }

  /* ---------------- GPS Capture + Reverse Geocode ---------------- */
  function captureGps() {
    var txtEl = state.activeShift ? $('outGpsText') : $('inGpsText');
    var coordEl = state.activeShift ? $('outGpsCoords') : $('inGpsCoords');
    txtEl.textContent = 'Fetching GPS location...';
    coordEl.textContent = '';

    if (!navigator.geolocation) {
      txtEl.textContent = 'Geolocation is not supported on this device.';
      return;
    }

    navigator.geolocation.getCurrentPosition(async function (pos) {
      var lat = Number(pos.coords.latitude.toFixed(6));
      var lng = Number(pos.coords.longitude.toFixed(6));
      state.gps = { lat: lat, lng: lng, address: lat + ', ' + lng, ready: true };
      coordEl.textContent = lat + ', ' + lng + ' (±' + Math.round(pos.coords.accuracy || 0) + 'm)';
      txtEl.textContent = 'Resolving street address...';

      try {
        var r = await fetch(
          'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lng,
          { headers: { 'Accept': 'application/json' } }
        );
        if (r.ok) {
          var j = await r.json();
          if (j && j.display_name) {
            state.gps.address = j.display_name;
          }
        }
      } catch (e) {
        // Keep coordinate fallback
      }
      txtEl.textContent = state.gps.address;
    }, function (err) {
      state.gps.ready = false;
      txtEl.textContent = 'Location permission denied or unavailable (' + err.message + '). Tap Refresh GPS.';
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  }

  /* ---------------- Data Loading from Supabase ---------------- */
  function renderProfileOptions(filterText) {
    var sel = $('profileSelect');
    var q = String(filterText || '').trim().toLowerCase();
    var list = state.profiles.filter(function (p) {
      if (!q) return true;
      return (p.name + ' ' + p.unit + ' ' + p.emp_id).toLowerCase().indexOf(q) !== -1;
    });

    sel.innerHTML = '<option value="">-- Choose your name (' + list.length + ') --</option>' +
      list.map(function (p) {
        var selected = p.emp_id === state.selectedEmpId ? ' selected' : '';
        return '<option value="' + esc(p.emp_id) + '"' + selected + '>' +
          esc(p.name) + ' (' + esc(p.emp_id) + (p.unit ? ' - ' + esc(p.unit) : '') + ')' +
          '</option>';
      }).join('');
  }

  async function loadBootstrap() {
    $('loadingMsg').textContent = 'Loading profiles from Supabase...';
    $('loading').classList.remove('hidden');

    try {
      var [profRes, setRes] = await Promise.all([
        sb.from('physio_profiles').select('emp_id, name, unit').order('name', { ascending: true }),
        sb.from('app_settings').select('key, value').eq('key', 'logo_url').maybeSingle()
      ]);

      if (profRes.error) throw profRes.error;
      state.profiles = profRes.data || [];

      if (setRes.data && setRes.data.value) {
        $('logo').innerHTML = '<img src="' + esc(setRes.data.value) + '" referrerpolicy="no-referrer" alt="Logo" />';
        $('logo').firstChild.onerror = function () { $('logo').textContent = 'PT'; };
      }

      renderProfileOptions($('profileSearch').value);
      if (state.selectedEmpId && state.profiles.some(function (p) { return p.emp_id === state.selectedEmpId; })) {
        await selectPhysio(state.selectedEmpId);
      }
    } catch (err) {
      showToast('Failed to connect to Supabase: ' + (err.message || err), 'err');
    } finally {
      $('loading').classList.add('hidden');
    }
  }

  async function selectPhysio(empId) {
    state.selectedEmpId = empId;
    if (empId) localStorage.setItem('pt_emp_id', empId);
    else localStorage.removeItem('pt_emp_id');

    state.inPhotoBlob = null;
    state.outPhotoBlob = null;
    $('inPhotoPreview').classList.add('hidden');
    $('outPhotoPreview').classList.add('hidden');

    var profile = state.profiles.find(function (p) { return p.emp_id === empId; });
    if (!profile) {
      $('profileMeta').classList.add('hidden');
      $('activeBanner').classList.add('hidden');
      $('signInCard').classList.add('hidden');
      $('signOutCard').classList.add('hidden');
      $('historyCard').classList.add('hidden');
      return;
    }

    $('profileMeta').innerHTML =
      '<span><b>' + esc(profile.name) + '</b> &middot; ' + esc(profile.unit || 'No unit') + '</span>' +
      '<span>ID: <b>' + esc(profile.emp_id) + '</b></span>';
    $('profileMeta').classList.remove('hidden');

    var attRes = await sb
      .from('attendance')
      .select('*')
      .eq('emp_id', empId)
      .order('sign_in_time', { ascending: false })
      .limit(10);

    if (attRes.error) {
      showToast('Could not load shifts: ' + attRes.error.message, 'err');
      return;
    }

    var rows = attRes.data || [];
    var tk = todayKey();
    state.recentShifts = rows;
    state.activeShift = rows.find(function (r) {
      return r.sign_in_date === tk && !r.sign_out_time;
    }) || null;

    if (state.activeShift) {
      $('activeBanner').classList.remove('hidden');
      $('activeMeta').innerHTML =
        '<b>' + esc(state.activeShift.hospital_name || 'Hospital') + '</b><br>' +
        'Signed in: ' + esc(fmtDT(state.activeShift.sign_in_time)) + '<br>' +
        'Location: ' + esc(state.activeShift.sign_in_location || '-');
      $('signInCard').classList.add('hidden');
      $('signOutCard').classList.remove('hidden');
    } else {
      $('activeBanner').classList.add('hidden');
      $('signOutCard').classList.add('hidden');
      $('signInCard').classList.remove('hidden');
    }

    renderHistory();
    updateClock();
    captureGps();
  }

  function renderHistory() {
    var list = state.recentShifts;
    if (!list.length) {
      $('historyCard').classList.add('hidden');
      return;
    }
    var tk = todayKey();
    $('historyCard').classList.remove('hidden');
    $('historyList').innerHTML = list.map(function (r) {
      var st = r.sign_out_time ? 'Completed' : (r.sign_in_date < tk ? 'Missing' : 'Active');
      var stLabel = st === 'Missing' ? 'Signout missing' : st;
      return (
        '<div class="history-item ' + st + '">' +
          '<div class="h-top"><span>' + esc(r.hospital_name || 'Hospital') + '</span><span>' + esc(stLabel) + '</span></div>' +
          '<div class="h-sub">' +
            'In: ' + esc(fmtDT(r.sign_in_time)) + '<br>' +
            'Out: ' + (r.sign_out_time ? esc(fmtDT(r.sign_out_time)) + ' (' + esc(r.duration || '-') + ')' : '-') +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  /* ---------------- Submit Sign In ---------------- */
  async function handleSignIn() {
    hideToast();
    var profile = state.profiles.find(function (p) { return p.emp_id === state.selectedEmpId; });
    if (!profile) return showToast('Please select your name first.', 'err');

    var hospital = $('hospitalInput').value.trim();
    if (!hospital) return showToast('Please enter the Hospital Name.', 'err');
    if (!state.gps.ready) return showToast('GPS location is required. Tap Refresh GPS.', 'err');
    if (!state.inPhotoBlob) return showToast('Please take a Sign-In photo first.', 'err');

    var btn = $('signInBtn');
    btn.disabled = true;
    btn.textContent = 'Uploading compressed photo...';

    try {
      var photoUrl = await uploadCompressedPhoto(state.inPhotoBlob, 'in', profile.emp_id);
      btn.textContent = 'Saving Sign In...';

      var now = new Date();
      var record = {
        id: 'ATT-' + now.getTime(),
        emp_id: profile.emp_id,
        physio_name: profile.name,
        unit: profile.unit || '',
        sign_in_date: todayKey(),
        sign_in_time: now.toISOString(),
        sign_in_location: state.gps.address,
        sign_in_lat: state.gps.lat,
        sign_in_lng: state.gps.lng,
        hospital_name: hospital,
        sign_in_photo: photoUrl,
        status: 'Active'
      };

      var ins = await sb.from('attendance').insert(record);
      if (ins.error) {
        if (ins.error.code === '23505') {
          throw new Error('You already have an active shift today. Refreshing...');
        }
        throw ins.error;
      }

      $('hospitalInput').value = '';
      showToast('Signed in successfully! Photo saved & synced.', 'ok');
      await selectPhysio(profile.emp_id);
    } catch (err) {
      showToast(err.message || String(err), 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Punch Sign In';
    }
  }

  /* ---------------- Submit Sign Out ---------------- */
  async function handleSignOut() {
    hideToast();
    if (!state.activeShift) return showToast('No active shift found.', 'err');
    if (!state.gps.ready) return showToast('GPS location is required. Tap Refresh GPS.', 'err');
    if (!state.outPhotoBlob) return showToast('Please take a Sign-Out photo first.', 'err');

    var btn = $('signOutBtn');
    btn.disabled = true;
    btn.textContent = 'Uploading compressed photo...';

    try {
      var photoUrl = await uploadCompressedPhoto(state.outPhotoBlob, 'out', state.activeShift.emp_id);
      btn.textContent = 'Saving Sign Out...';

      var nowIso = new Date().toISOString();
      var duration = formatDuration(state.activeShift.sign_in_time, nowIso);

      var upd = await sb
        .from('attendance')
        .update({
          sign_out_time: nowIso,
          sign_out_location: state.gps.address,
          sign_out_lat: state.gps.lat,
          sign_out_lng: state.gps.lng,
          pre_name: $('preNameInput').value.trim(),
          patients_visited: $('visitedInput').value.trim(),
          assessments_done: $('assessedInput').value.trim(),
          converted: $('convertedInput').value.trim(),
          remarks: $('remarksInput').value.trim(),
          sign_out_photo: photoUrl,
          duration: duration,
          status: 'Completed'
        })
        .eq('id', state.activeShift.id)
        .is('sign_out_time', null);

      if (upd.error) throw upd.error;

      $('preNameInput').value = '';
      $('visitedInput').value = '';
      $('assessedInput').value = '';
      $('convertedInput').value = '';
      $('remarksInput').value = '';
      showToast('Signed out successfully! Shift duration: ' + duration, 'ok');
      await selectPhysio(state.selectedEmpId);
    } catch (err) {
      showToast(err.message || String(err), 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Punch Sign Out';
    }
  }

  /* ---------------- Photo Inputs ---------------- */
  async function handlePhotoPick(file, kind) {
    if (!file) return;
    var preview = $(kind === 'in' ? 'inPhotoPreview' : 'outPhotoPreview');
    var img = $(kind === 'in' ? 'inPhotoImg' : 'outPhotoImg');
    var meta = $(kind === 'in' ? 'inPhotoMeta' : 'outPhotoMeta');

    try {
      var origKB = Math.round(file.size / 1024);
      var blob = await compressImage(file, 960, 0.65);
      var compKB = Math.round(blob.size / 1024);

      if (kind === 'in') state.inPhotoBlob = blob;
      else state.outPhotoBlob = blob;

      img.src = URL.createObjectURL(blob);
      meta.textContent = 'Compressed: ' + compKB + ' KB (was ' + origKB + ' KB)';
      preview.classList.remove('hidden');
    } catch (err) {
      showToast('Photo error: ' + err.message, 'err');
    }
  }

  /* ---------------- Event Listeners ---------------- */
  $('profileSearch').addEventListener('input', function (e) {
    renderProfileOptions(e.target.value);
  });
  $('profileSelect').addEventListener('change', function (e) {
    hideToast();
    selectPhysio(e.target.value);
  });
  $('refreshBtn').addEventListener('click', loadBootstrap);
  $('inGpsBtn').addEventListener('click', captureGps);
  $('outGpsBtn').addEventListener('click', captureGps);
  $('inPhotoInput').addEventListener('change', function (e) {
    handlePhotoPick(e.target.files[0], 'in');
  });
  $('outPhotoInput').addEventListener('change', function (e) {
    handlePhotoPick(e.target.files[0], 'out');
  });
  $('signInBtn').addEventListener('click', handleSignIn);
  $('signOutBtn').addEventListener('click', handleSignOut);

  updateClock();
  setInterval(updateClock, 30000);
  loadBootstrap();
})();
</script>
</body>
</html>
